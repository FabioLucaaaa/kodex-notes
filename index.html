<style>
/* =========================================================================
   KODEX — Design-Tokens
   Richtung: "Bibliothek bei Nacht" — Tinte/Aubergine + Messing, Serif-Display
   ========================================================================= */
:root{
  --ink-900:#0F0E15; --ink-800:#14131C; --ink-700:#1B1A25; --ink-600:#232131;
  --ink-500:#2E2B3E; --ink-400:#3B3850;
  --brass:#D9A441; --brass-soft:rgba(217,164,65,.14); --brass-line:rgba(217,164,65,.38);
  --teal:#3FA394; --rose:#E0607E; --violet:#8E7BEE; --sky:#5FA8D3;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --side-w:268px; --rail-w:236px;
  --t:120ms cubic-bezier(.2,.6,.3,1);
}
/* Papierton: --paper-l färbt den Hellmodus, --paper-d tönt den Dunkelmodus */
html{--paper-l:#F1EFEA; --paper-d:#8A85A0; --fs:15px}
html[data-theme="dark"]{
  --bg:color-mix(in oklab,var(--ink-900) 93%,var(--paper-d));
  --bg-2:color-mix(in oklab,var(--ink-800) 93%,var(--paper-d));
  --surface:color-mix(in oklab,var(--ink-700) 93%,var(--paper-d));
  --surface-2:color-mix(in oklab,var(--ink-600) 92%,var(--paper-d));
  --line:color-mix(in oklab,#2A2838 90%,var(--paper-d));
  --line-soft:color-mix(in oklab,#211F2D 92%,var(--paper-d));
  --tx:#E9E6F2; --tx-2:#A7A2BC; --tx-3:#6F6B85;
  --accent:var(--brass); --accent-tx:#1A1710;
  --shadow:0 18px 50px -12px rgba(0,0,0,.75);
  --hl:rgba(217,164,65,.20);
  --rule:color-mix(in oklab,var(--tx-3) 34%,transparent);
}
html[data-theme="light"]{
  --bg:var(--paper-l);
  --bg-2:color-mix(in oklab,var(--paper-l) 93%,#100D1A);
  --surface:color-mix(in oklab,var(--paper-l) 30%,#FFFFFF);
  --surface-2:color-mix(in oklab,var(--paper-l) 66%,#FFFFFF);
  --line:color-mix(in oklab,var(--paper-l) 68%,#8C8578);
  --line-soft:color-mix(in oklab,var(--paper-l) 84%,#8C8578);
  --tx:#221F2E; --tx-2:#5C5870; --tx-3:#8B8799;
  --accent:#8A5A0B; --accent-tx:#FFFDF6;
  --brass-soft:rgba(138,90,11,.10); --brass-line:rgba(138,90,11,.30);
  --teal:#1F7A6C; --rose:#B93A57; --violet:#5E4BC4; --sky:#2A6E96;
  --shadow:0 16px 40px -14px rgba(34,31,46,.28);
  --hl:rgba(138,90,11,.16);
  --rule:color-mix(in oklab,var(--tx-3) 30%,transparent);
}

/* Schriftbild — nur Systemschriften, damit die Datei ohne Netz auskommt */
html[data-font="serif"]{--font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-font="sans"]{--font-display:system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,sans-serif;--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-font="humanist"]{--font-display:Optima,Candara,"Gill Sans","Gill Sans MT",system-ui,sans-serif;--font-ui:Candara,Optima,"Segoe UI",system-ui,sans-serif}
html[data-font="rounded"]{--font-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Trebuchet MS",system-ui,sans-serif;--font-ui:ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif}
html[data-font="mono"]{--font-display:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;--font-ui:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
html[data-font="typewriter"]{--font-display:"Courier New",Courier,ui-monospace,monospace;--font-ui:"Courier New",Courier,ui-monospace,monospace}
html[data-font="book"]{--font-display:"Hoefler Text",Constantia,"Times New Roman",Georgia,serif;--font-ui:Constantia,Georgia,"Times New Roman",serif}

/* Hintergrundmuster — liegt hinter dem Inhalt und scrollt mit */
html{--pat:none;--pat-size:auto}
html[data-pattern="lines"]{--pat:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
html[data-pattern="grid"]{--pat:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px),repeating-linear-gradient(to right,transparent 0 31px,var(--rule) 31px 32px)}
html[data-pattern="dots"]{--pat:radial-gradient(circle,var(--rule) 1.2px,transparent 1.2px);--pat-size:24px 24px}
html[data-pattern="graph"]{--pat:repeating-linear-gradient(to bottom,transparent 0 19px,var(--rule) 19px 20px),repeating-linear-gradient(to right,transparent 0 19px,var(--rule) 19px 20px),repeating-linear-gradient(to bottom,transparent 0 99px,var(--rule) 99px 100px),repeating-linear-gradient(to right,transparent 0 99px,var(--rule) 99px 100px)}
html[data-pattern="cross"]{--pat:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px),repeating-linear-gradient(to right,transparent 0 27px,var(--rule) 27px 28px);--pat-size:auto}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:var(--font-ui); font-size:var(--fs,15px); line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::selection{background:var(--hl)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tx-3);background-clip:content-box;border:3px solid transparent}
*::-webkit-scrollbar-track{background:transparent}

/* Utility */
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3)}
.mono{font-family:var(--font-mono)}
kbd{font-family:var(--font-mono);font-size:10.5px;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--tx-2);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--tx-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

/* =========================================================================
   Shell
   ========================================================================= */
#app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--rail-w);height:100vh;height:100dvh;overflow:hidden;min-height:0}
/* min-height:0 ist zwingend: sonst wachsen die Grid-Bereiche über den Bildschirm und nichts lässt sich scrollen */
#app>*{min-height:0;min-width:0}
#app.no-rail{grid-template-columns:var(--side-w) minmax(0,1fr) 0}
#app.no-side{grid-template-columns:0 minmax(0,1fr) var(--rail-w)}
#app.no-side.no-rail{grid-template-columns:0 minmax(0,1fr) 0}

/* Sidebar */
#sidebar{background:var(--tint-soft,var(--bg-2));border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#app.no-side #sidebar{display:none}
@media (max-width:820px){#app.no-side #sidebar{display:flex}}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:17px;letter-spacing:.06em;flex:1;min-width:0}
.brand b{font-weight:600}
.mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,#1E1B2B,#12111A);border:1px solid var(--brass-line);flex:none;box-shadow:0 2px 10px -3px var(--brass-line);overflow:hidden}
.mark svg{width:22px;height:22px;color:var(--accent);display:block}
.icon-btn{width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--tx-3);transition:var(--t);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--tx)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--tx-3);font-size:13px;transition:var(--t)}
.side-search:hover{border-color:var(--brass-line);color:var(--tx-2)}
.side-search kbd{margin-left:auto}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 16px;-webkit-overflow-scrolling:touch}
.side-sec{margin-bottom:14px}
.side-label{display:flex;align-items:center;gap:6px;padding:5px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3)}
.side-label .add{margin-left:auto;opacity:0;transition:var(--t)}
.side-sec:hover .side-label .add{opacity:1}
.nav-row{display:flex;align-items:center;gap:7px;width:100%;padding:5px 8px;border-radius:var(--r-s);color:var(--tx-2);font-size:13.5px;text-align:left;transition:background var(--t),color var(--t)}
.nav-row:hover{background:var(--surface)}
.nav-row.active{background:var(--surface);color:var(--tx);box-shadow:inset 2px 0 0 var(--accent)}
.nav-row svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tree-row{display:flex;align-items:center;gap:5px;border-radius:var(--r-s);padding-right:4px;transition:background var(--t)}
.tree-row:hover{background:var(--surface)}
.tree-row.active{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.tree-row.drop-into{background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass-line)}
.tree-row.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.tree-row.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
.tw{display:flex;align-items:center;gap:5px;flex:1;min-width:0;padding:5px 2px;color:var(--tx-2);font-size:13.5px;text-align:left}
.tree-row.active .tw{color:var(--tx)}
.twist{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;color:var(--tx-3);flex:none}
.twist:hover{background:var(--surface-2);color:var(--tx)}
.twist svg{width:11px;height:11px;transition:transform var(--t)}
.twist.open svg{transform:rotate(90deg)}
.t-emoji{width:17px;text-align:center;flex:none;font-size:13.5px;line-height:1}
.t-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-act{opacity:0;transition:var(--t)}
.tree-row:hover .t-act{opacity:1}
.children{margin-left:12px;border-left:1px solid var(--line-soft);padding-left:2px}
.side-foot{padding:9px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx-3)}
/* =========================================================================
   Hauptbereich / Kopfzeile
   ========================================================================= */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-bottom:1px solid var(--line-soft);background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex:none}
#crumbs{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;font-size:13px;color:var(--tx-2)}
#crumbs button{color:var(--tx-2);padding:3px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
#crumbs button:hover{background:var(--surface-2);color:var(--tx)}
#crumbs .sep{color:var(--tx-3);flex:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background-image:var(--pat);background-size:var(--pat-size);background-attachment:local}
.pad{max-width:var(--doc-w,760px);margin:0 auto;padding:0 56px 40vh}
.wide .pad{--doc-w:1100px}

/* Cover + Titel */
.cover{height:170px;background:linear-gradient(120deg,color-mix(in oklab,var(--accent) 70%,transparent),color-mix(in oklab,var(--violet) 60%,transparent));position:relative}
.cover.none{display:none}
.page-head{padding-top:34px}
.page-icon{font-size:52px;line-height:1;cursor:pointer;display:inline-block;transition:transform var(--t)}
.page-icon:hover{transform:scale(1.06) rotate(-3deg)}
.page-title{font-family:var(--font-display);font-size:40px;line-height:1.12;font-weight:600;letter-spacing:-.01em;margin:8px 0 2px;outline:none}
.page-title:empty::before{content:"Ohne Titel";color:var(--tx-3)}
.page-meta{display:flex;align-items:center;gap:12px;padding:8px 0 20px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}

/* =========================================================================
   Editor / Blöcke
   ========================================================================= */
.blocks{position:relative}
.brow{position:relative;display:flex;align-items:flex-start;gap:2px;border-radius:5px}
.brow.drag-over-top::before,.brow.drag-over-bot::before{content:"";position:absolute;left:26px;right:0;height:2px;background:var(--accent);border-radius:2px}
.brow.drag-over-top::before{top:-1px} .brow.drag-over-bot::before{bottom:-1px}
.brow.dragging{opacity:.35}
.bctl{position:absolute;left:-46px;top:2px;display:flex;gap:1px;opacity:0;transition:opacity var(--t)}
.brow:hover .bctl,.brow.menu-open .bctl{opacity:1}
.bctl button{width:20px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--tx-3)}
.bctl button:hover{background:var(--surface-2);color:var(--tx)}
.bctl svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.bctl .grip{cursor:grab}
.blk{flex:1;min-width:0;outline:none;padding:3px 2px;border-radius:4px;caret-color:var(--accent);word-break:break-word}
.blk:empty::before{content:attr(data-ph);color:var(--tx-3);pointer-events:none}
.blk[data-t="p"]:empty::before{content:""}
.brow:focus-within .blk[data-t="p"]:empty::before{content:attr(data-ph)}
.blk a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.blk code{font-family:var(--font-mono);font-size:.87em;background:var(--surface-2);border:1px solid var(--line-soft);padding:1px 5px;border-radius:5px;color:var(--rose)}
.blk .pl{color:var(--accent);background:var(--brass-soft);border-radius:4px;padding:0 4px;cursor:pointer;text-decoration:none;
  border-bottom:1px solid var(--brass-line)}
.blk .pl:hover{background:color-mix(in oklab,var(--accent) 26%,transparent)}
.blk .pl .brk{display:none;opacity:.45;font-style:normal}
.brow:focus-within .blk .pl .brk{display:inline}
.blk mark{background:var(--hl);color:inherit;border-radius:3px}
h1.blk,h2.blk,h3.blk{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;margin:0}
h1.blk{font-size:28px;line-height:1.25;padding-top:18px}
h2.blk{font-size:22px;line-height:1.3;padding-top:14px}
h3.blk{font-size:18px;line-height:1.35;padding-top:10px}
.brow[data-t="quote"] .blk{border-left:3px solid var(--accent);padding-left:14px;font-family:var(--font-display);font-size:16.5px;color:var(--tx)}
.brow[data-t="divider"]{padding:8px 0}
.brow[data-t="divider"] .blk{height:1px;background:var(--line);padding:0;margin:8px 0}
.bullet-dot,.num-dot,.tg-caret{flex:none;width:22px;display:flex;justify-content:center;padding-top:6px;color:var(--tx-2);font-size:13px;user-select:none}
.bullet-dot::before{content:"•";font-size:17px;line-height:.9}
.brow[data-i="1"] .bullet-dot::before{content:"◦"}
.brow[data-i="2"] .bullet-dot::before{content:"▪";font-size:12px}
.chk{flex:none;width:22px;display:flex;justify-content:center;padding-top:6px}
.chk input{appearance:none;width:15px;height:15px;border:1.5px solid var(--tx-3);border-radius:4px;cursor:pointer;transition:var(--t);position:relative}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--accent-tx);border-width:0 2px 2px 0;transform:rotate(42deg)}
.brow.done .blk{color:var(--tx-3);text-decoration:line-through}
.tg-caret{cursor:pointer} .tg-caret svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform var(--t)}
.tg-caret.open svg{transform:rotate(90deg)}
.callout{flex:1;display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-m);background:var(--brass-soft);border:1px solid var(--brass-line)}
.callout .ci{font-size:17px;line-height:1.3;cursor:pointer;flex:none}
.code-wrap{flex:1;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.code-bar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.code-bar select{background:none;border:0;font-family:var(--font-mono);font-size:11px;color:var(--tx-3);cursor:pointer}
.code-bar .cp{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--tx-3)}
.code-bar .cp:hover{color:var(--accent)}
.blk[data-t="code"]{font-family:var(--font-mono);font-size:13px;line-height:1.6;white-space:pre-wrap;padding:12px 14px;tab-size:2}
.img-wrap{flex:1}
.img-wrap img{max-width:100%;border-radius:var(--r-m);border:1px solid var(--line);display:block}
.img-empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:20px;text-align:center;color:var(--tx-3);font-size:13px;cursor:pointer}
.img-empty:hover{border-color:var(--brass-line);color:var(--tx-2)}
.blk[data-i="1"]{margin-left:26px} .blk[data-i="2"]{margin-left:52px} .blk[data-i="3"]{margin-left:78px}
.brow[data-i="1"]>.bullet-dot,.brow[data-i="1"]>.chk,.brow[data-i="1"]>.num-dot{margin-left:26px}
.brow[data-i="2"]>.bullet-dot,.brow[data-i="2"]>.chk,.brow[data-i="2"]>.num-dot{margin-left:52px}
.brow[data-i="3"]>.bullet-dot,.brow[data-i="3"]>.chk,.brow[data-i="3"]>.num-dot{margin-left:78px}
.add-block{display:flex;align-items:center;gap:8px;width:100%;padding:8px 4px;margin-top:6px;color:var(--tx-3);font-size:13.5px;border-radius:var(--r-s);opacity:.55;transition:var(--t)}
.add-block:hover{opacity:1;background:var(--surface);color:var(--tx-2)}

/* Auswahl-Werkzeugleiste */
#seltool{position:fixed;z-index:60;display:none;align-items:center;gap:1px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow)}
#seltool.on{display:flex}
#seltool button{padding:5px 8px;border-radius:6px;font-size:13px;color:var(--tx-2);min-width:28px}
#seltool button:hover{background:var(--surface-2);color:var(--accent)}
#seltool .b{font-weight:700} #seltool .i{font-style:italic;font-family:var(--font-display)}
#seltool .s{text-decoration:line-through} #seltool .c{font-family:var(--font-mono);font-size:11px}
#seltool .sep{width:1px;height:18px;background:var(--line);margin:0 3px}

/* =========================================================================
   Menüs, Popovers, Modale
   ========================================================================= */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);padding:6px;min-width:210px;max-height:56vh;overflow-y:auto;display:none;animation:rise .12s ease}
.pop.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pop-lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);padding:7px 9px 4px}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:var(--r-s);font-size:13.5px;color:var(--tx-2);text-align:left}
.pop-item:hover,.pop-item.sel{background:var(--surface-2);color:var(--tx)}
.pop-item.sel{box-shadow:inset 2px 0 0 var(--accent)}
.pop-item .ico{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);font-size:12px;flex:none;border:1px solid var(--line-soft)}
.pop-item .sub{font-size:11px;color:var(--tx-3);margin-left:auto;font-family:var(--font-mono)}
.pop-item.danger:hover{color:var(--rose)}
.pop hr{border:0;border-top:1px solid var(--line-soft);margin:5px 2px}
.pop input[type=text],.pop input[type=number],.pop input[type=date],.pop select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);font-size:13px;margin:2px 0}

.scrim{position:fixed;inset:0;z-index:70;background:rgba(8,7,12,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.scrim.on{display:flex}
.modal{width:min(660px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;animation:rise .14s ease}
.modal.big{width:min(900px,94vw)}
.m-input{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.m-input input{flex:1;background:none;border:0;outline:none;font-size:16px}
.m-input input::placeholder{color:var(--tx-3)}
.m-list{max-height:52vh;overflow-y:auto;padding:6px}
.m-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--tx-3);background:var(--surface-2)}
.res{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r-s);text-align:left}
.res:hover,.res.sel{background:var(--surface-2)}
.res.sel{box-shadow:inset 2px 0 0 var(--accent)}
.res .rt{font-size:14px;color:var(--tx);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rs{font-size:12px;color:var(--tx-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rk{margin-left:auto;flex:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-m);padding:10px 16px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* =========================================================================
   Datenbanken
   ========================================================================= */
.db-bar{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--line-soft);margin-bottom:12px;flex-wrap:wrap}
.vtab{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-s);font-size:13px;color:var(--tx-3);transition:var(--t)}
.vtab:hover{background:var(--surface)}
.vtab.on{color:var(--tx);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.vtab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.db-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.tbtn{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:var(--r-s);font-size:12.5px;color:var(--tx-3)}
.tbtn:hover{background:var(--surface);color:var(--tx)}
.tbtn.act{color:var(--accent);background:var(--brass-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-s);background:var(--accent);color:var(--accent-tx);font-size:13px;font-weight:600;transition:var(--t)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--tx-2);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--brass-line);color:var(--tx)}
.rule{display:flex;align-items:center;gap:6px;padding:5px;font-size:12.5px}
.rule select,.rule input{padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:12.5px;max-width:130px}

/* Tabelle */
.tbl-scroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r-m)}
table.db{border-collapse:collapse;width:100%;font-size:13.5px}
table.db th{text-align:left;font-weight:500;color:var(--tx-3);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:2}
table.db th .pt{font-family:var(--font-mono);font-size:9px;color:var(--tx-3);opacity:.7;margin-left:5px}
table.db td{padding:0;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);vertical-align:top;min-width:110px}
table.db tr:hover td{background:color-mix(in oklab,var(--surface) 60%,transparent)}
.cell{padding:7px 10px;min-height:33px;cursor:text;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cell:hover{box-shadow:inset 0 0 0 1px var(--line)}
.cell input,.cell select{width:100%;background:none;border:0;outline:none;font-size:13.5px}
.cell.title{font-weight:500;cursor:pointer;color:var(--tx)}
.cell.title:hover .open-pg{opacity:1}
.open-pg{margin-left:auto;opacity:0;font-size:10px;font-family:var(--font-mono);color:var(--tx-3);border:1px solid var(--line);padding:1px 6px;border-radius:4px;transition:var(--t)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line)}
.tag.c-brass{background:var(--brass-soft);border-color:var(--brass-line);color:var(--accent)}
.tag.c-teal{background:color-mix(in oklab,var(--teal) 16%,transparent);border-color:color-mix(in oklab,var(--teal) 45%,transparent);color:var(--teal)}
.tag.c-rose{background:color-mix(in oklab,var(--rose) 16%,transparent);border-color:color-mix(in oklab,var(--rose) 45%,transparent);color:var(--rose)}
.tag.c-violet{background:color-mix(in oklab,var(--violet) 16%,transparent);border-color:color-mix(in oklab,var(--violet) 45%,transparent);color:var(--violet)}
.tag.c-sky{background:color-mix(in oklab,var(--sky) 16%,transparent);border-color:color-mix(in oklab,var(--sky) 45%,transparent);color:var(--sky)}
.tag.c-grey{color:var(--tx-3)}
.row-add{padding:8px 10px;color:var(--tx-3);font-size:13px;width:100%;text-align:left}
.row-add:hover{color:var(--accent);background:var(--surface)}
.db-foot{display:flex;gap:16px;padding:8px 2px;font-size:11.5px;color:var(--tx-3);font-family:var(--font-mono)}

/* Board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.bcol{flex:none;width:262px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:9px;transition:var(--t)}
.bcol.over{box-shadow:inset 0 0 0 2px var(--brass-line)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:2px 3px 9px}
.bcol-h .cnt{font-family:var(--font-mono);font-size:11px;color:var(--tx-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 11px;margin-bottom:7px;cursor:grab;transition:var(--t)}
.card:hover{border-color:var(--brass-line);transform:translateY(-1px)}
.card.dragging{opacity:.4}
.card .ct{font-size:13.5px;font-weight:500;margin-bottom:6px}
.card .cm{display:flex;flex-wrap:wrap;gap:5px}

/* Kalender */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-head .m{font-family:var(--font-display);font-size:19px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden}
.cal .dw{padding:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);background:var(--surface-2);text-align:center;border-bottom:1px solid var(--line-soft)}
.cal .day{min-height:92px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:5px;font-size:12px}
.cal .day.out{background:var(--surface-2);opacity:.55}
.cal .day.today .dn{background:var(--accent);color:var(--accent-tx);border-radius:50%}
.cal .dn{display:inline-grid;place-items:center;width:20px;height:20px;font-family:var(--font-mono);font-size:11px;color:var(--tx-3);margin-bottom:3px}
.cal .ev{display:block;width:100%;text-align:left;font-size:11.5px;padding:2px 6px;border-radius:4px;background:var(--brass-soft);color:var(--accent);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid var(--accent)}

/* Galerie + Liste */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface);cursor:pointer;transition:var(--t)}
.gcard:hover{border-color:var(--brass-line);transform:translateY(-2px)}
.gcard .gh{height:88px;background:linear-gradient(135deg,var(--surface-2),color-mix(in oklab,var(--accent) 22%,transparent));display:grid;place-items:center;font-size:28px}
.gcard .gb{padding:10px 11px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:var(--r-s)}
.lrow:hover{background:var(--surface)}
.lrow .lt{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* =========================================================================
   Rechte Leiste — der "Rücken"
   ========================================================================= */
#rail{border-left:1px solid var(--line);background:var(--tint-soft,var(--bg-2));overflow-y:auto;padding:16px 14px;min-width:0;min-height:0;-webkit-overflow-scrolling:touch}
#app.no-rail #rail{display:none}
.rail-sec{margin-bottom:22px}
.rail-h{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.spine{display:flex;gap:9px;align-items:stretch}
.spine-ticks{display:flex;flex-direction:column;gap:3px;padding-top:3px;flex:none}
.tick{height:3px;border-radius:2px;background:var(--line);transition:var(--t);cursor:pointer}
.tick[data-k="h1"]{width:22px;background:var(--tx-3)} .tick[data-k="h2"]{width:16px;background:var(--tx-3)}
.tick[data-k="h3"]{width:12px;background:var(--tx-3)} .tick[data-k="p"]{width:9px}
.tick[data-k="code"]{width:9px;background:var(--rose);opacity:.55}
.tick[data-k="todo"]{width:9px;background:var(--teal);opacity:.7}
.tick.cur{background:var(--accent) !important;opacity:1}
.toc{flex:1;min-width:0}
.toc button{display:block;width:100%;text-align:left;font-size:12.5px;color:var(--tx-2);padding:3px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc button:hover{background:var(--surface);color:var(--tx)}
.toc button[data-k="h2"]{padding-left:14px;font-size:12px;color:var(--tx-3)}
.toc button[data-k="h3"]{padding-left:24px;font-size:12px;color:var(--tx-3)}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--tx-3)}
.stat b{color:var(--tx-2);font-weight:500;font-family:var(--font-mono);font-size:11.5px}
.bl{display:block;width:100%;text-align:left;font-size:12.5px;padding:6px 8px;border:1px solid var(--line-soft);border-radius:var(--r-s);margin-bottom:5px;color:var(--tx-2)}
.bl:hover{border-color:var(--brass-line);color:var(--tx)}
.bl .bs{display:block;font-size:11px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* =========================================================================
   Konzept-Dokument
   ========================================================================= */
.doc{max-width:900px;margin:0 auto;padding:0 56px 120px}
.hero{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.hero .kicker{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.hero h1{font-family:var(--font-display);font-size:clamp(38px,6vw,62px);line-height:1.02;letter-spacing:-.02em;font-weight:600;margin:0 0 18px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p.lead{font-size:17.5px;line-height:1.62;color:var(--tx-2);max-width:62ch;margin:0 0 26px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.doc h2{font-family:var(--font-display);font-size:29px;font-weight:600;letter-spacing:-.01em;margin:56px 0 6px;scroll-margin-top:60px}
.doc h3{font-family:var(--font-display);font-size:19px;font-weight:600;margin:30px 0 8px}
.doc p{color:var(--tx-2);margin:9px 0;max-width:70ch}
.doc ul,.doc ol{color:var(--tx-2);padding-left:20px;margin:9px 0;max-width:70ch}
.doc li{margin:5px 0}
.doc strong{color:var(--tx);font-weight:600}
.doc code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line-soft);padding:1px 5px;border-radius:5px;color:var(--rose)}
.sec-lead{display:flex;align-items:baseline;gap:12px;margin:56px 0 6px}
.sec-lead .n{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.1em;padding-top:6px}
.sec-lead h2{margin:0}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:18px 0}
.kcard{border:1px solid var(--line);border-radius:var(--r-m);padding:16px;background:var(--surface)}
.kcard h4{font-family:var(--font-display);font-size:16px;margin:8px 0 6px;font-weight:600}
.kcard p{font-size:13.5px;margin:0;color:var(--tx-3)}
.matrix{width:100%;border-collapse:collapse;font-size:13.5px;margin:18px 0;border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden}
.matrix th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);padding:10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.matrix td{padding:9px 10px;border-bottom:1px solid var(--line-soft);color:var(--tx-2);vertical-align:top}
.matrix tr:last-child td{border-bottom:0}
.matrix td:first-child{color:var(--tx);font-weight:500;white-space:nowrap}
.st{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.st.ok{background:color-mix(in oklab,var(--teal) 18%,transparent);color:var(--teal)}
.st.part{background:var(--brass-soft);color:var(--accent)}
.st.plan{background:var(--surface-2);color:var(--tx-3)}
pre.blueprint{font-family:var(--font-mono);font-size:12px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;overflow-x:auto;color:var(--tx-2)}
pre.blueprint b{color:var(--accent);font-weight:400}
.phase{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.phase .pl{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.08em;padding-top:3px}
.phase h4{margin:0 0 5px;font-family:var(--font-display);font-size:17px;font-weight:600}
.phase p{margin:0;font-size:13.5px}
.kbd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 22px;margin:14px 0}
.kbd-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--tx-2)}
.kbd-row kbd{margin-left:auto}
.note{border-left:3px solid var(--accent);background:var(--brass-soft);padding:13px 16px;border-radius:0 var(--r-m) var(--r-m) 0;margin:18px 0;font-size:14px;color:var(--tx-2)}

/* Schutz: Sperrbildschirm und Sperrkasten */
#gate{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center;padding:20px}
.gate-card{width:min(380px,92vw);text-align:center}
.gate-card h2{font-family:var(--font-display);font-size:24px;font-weight:600;margin:10px 0 6px}
.gate-card p{font-size:13.5px;color:var(--tx-2);margin:0 0 18px}
.gate-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);font-size:16px;text-align:center;letter-spacing:.12em}
.gate-card input:focus{outline:none;border-color:var(--accent)}
.gate-msg{min-height:20px;font-size:12.5px;color:var(--tx-3);padding:8px 0}
.lockbox{max-width:460px;margin:40px auto;text-align:center;border:1px solid var(--line);border-radius:var(--r-l);padding:32px 26px;background:var(--surface)}
.lockbox .lb-ico{font-size:38px;margin-bottom:12px}
.lockbox h3{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 8px}
.lockbox p{font-size:13.5px;color:var(--tx-2);margin:0}
.lockbox .lb-meta{font-size:10.5px;color:var(--tx-3);margin-top:18px;letter-spacing:.04em}

/* Papier, Muster, Schrift */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin:16px 0}
.sw{border:1px solid var(--line);border-radius:var(--r-m);padding:8px;background:var(--surface);transition:var(--t);text-align:left}
.sw:hover{border-color:var(--brass-line);transform:translateY(-1px)}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw-c{display:inline-block;width:26px;height:26px;border-radius:7px;border:1px solid var(--line)}
.sw-c.d{margin-left:4px}
.sw-n{display:block;font-size:11.5px;color:var(--tx-2);margin-top:6px}
.pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;margin:12px 0 4px}
.pat{border:1px solid var(--line);border-radius:var(--r-m);padding:8px;background:var(--surface);font-size:12px;color:var(--tx-2);transition:var(--t)}
.pat:hover{border-color:var(--brass-line)} .pat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--tx)}
.pat-p{display:block;height:42px;border-radius:var(--r-s);border:1px solid var(--line-soft);margin-bottom:6px;background-color:var(--bg)}
.pat-p[data-p="lines"]{background-image:repeating-linear-gradient(to bottom,transparent 0 9px,var(--rule) 9px 10px)}
.pat-p[data-p="grid"]{background-image:repeating-linear-gradient(to bottom,transparent 0 9px,var(--rule) 9px 10px),repeating-linear-gradient(to right,transparent 0 9px,var(--rule) 9px 10px)}
.pat-p[data-p="dots"]{background-image:radial-gradient(circle,var(--rule) 1.1px,transparent 1.1px);background-size:9px 9px}
.pat-p[data-p="graph"]{background-image:repeating-linear-gradient(to bottom,transparent 0 5px,var(--rule) 5px 6px),repeating-linear-gradient(to right,transparent 0 5px,var(--rule) 5px 6px)}
.pat-p[data-p="cross"]{background-image:repeating-linear-gradient(to bottom,transparent 0 7px,var(--rule) 7px 8px),repeating-linear-gradient(to right,transparent 0 7px,var(--rule) 7px 8px)}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin:14px 0}
.fnt{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 13px;background:var(--surface);text-align:left;transition:var(--t)}
.fnt:hover{border-color:var(--brass-line)} .fnt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fnt b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.fnt span{display:block;font-family:var(--font-ui);font-size:11px;color:var(--tx-3);margin-bottom:6px}
.fnt i{display:block;font-size:13px;color:var(--tx-2);font-style:normal}

/* Tests */
.t-sum{display:flex;gap:22px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin:14px 0;align-items:center;flex-wrap:wrap}
.t-sum .big{font-family:var(--font-display);font-size:30px;line-height:1}
.t-grp{margin:14px 0;border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden}
.t-grp h4{margin:0;padding:9px 13px;background:var(--surface-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-2);display:flex;gap:10px}
.t-grp h4 span{margin-left:auto;color:var(--tx-3)}
.t-line{display:flex;gap:10px;padding:5px 13px;font-size:12.5px;border-top:1px solid var(--line-soft);font-family:var(--font-mono);color:var(--tx-3)}
.t-line.f{color:var(--rose);background:color-mix(in oklab,var(--rose) 8%,transparent)}
.t-line .ic{color:var(--teal)} .t-line.f .ic{color:var(--rose)}

/* Einstellungen / leere Zustände */
.set-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.set-row .sl{flex:1} .set-row .sl b{display:block;font-size:14px;font-weight:500}
.set-row .sl span{font-size:12.5px;color:var(--tx-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg button{padding:5px 12px;font-size:12.5px;color:var(--tx-3)}
.seg button.on{background:var(--accent);color:var(--accent-tx)}
.empty{text-align:center;padding:60px 20px;color:var(--tx-3)}
.empty .e-ico{font-size:34px;margin-bottom:10px}
.empty h3{font-family:var(--font-display);font-size:19px;color:var(--tx-2);margin:0 0 6px;font-weight:600}
.empty p{font-size:13.5px;margin:0 0 16px}

/* =========================================================================
   Arbeitsfläche: Papierton + Muster
   ========================================================================= */
html[data-theme="light"]{ --paper-bg:var(--tint,#F1EFEA); --paper-line:rgba(40,34,24,.11); --paper-line-2:rgba(40,34,24,.06); }
html[data-theme="dark"]{ --paper-bg:var(--tint,#0F0E15); --paper-line:rgba(255,255,255,.10); --paper-line-2:rgba(255,255,255,.055); }
#view{ background-color:var(--paper-bg); --rule:27px; }
#view[data-pattern="lines"]{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule) - 1px),var(--paper-line) calc(var(--rule) - 1px),var(--paper-line) var(--rule));
  background-attachment:local;}
#view[data-pattern="grid"]{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule) - 1px),var(--paper-line) calc(var(--rule) - 1px),var(--paper-line) var(--rule)),
                   repeating-linear-gradient(to right,transparent 0,transparent calc(var(--rule) - 1px),var(--paper-line) calc(var(--rule) - 1px),var(--paper-line) var(--rule));
  background-attachment:local;}
#view[data-pattern="dots"]{
  background-image:radial-gradient(circle,var(--paper-line) 1.15px,transparent 1.15px);
  background-size:var(--rule) var(--rule);background-attachment:local;}
#view[data-pattern="graph"]{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule)*2 - 1px),var(--paper-line) calc(var(--rule)*2 - 1px),var(--paper-line) calc(var(--rule)*2)),
                   repeating-linear-gradient(to right,transparent 0,transparent calc(var(--rule)*2 - 1px),var(--paper-line) calc(var(--rule)*2 - 1px),var(--paper-line) calc(var(--rule)*2)),
                   repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2)),
                   repeating-linear-gradient(to right,transparent 0,transparent calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2));
  background-attachment:local;}
#view[data-pattern="cross"]{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2)),
                   repeating-linear-gradient(to right,transparent 0,transparent calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2 - 1px),var(--paper-line-2) calc(var(--rule)/2));
  background-attachment:local;}
#view[data-pattern="margin"]{
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule) - 1px),var(--paper-line) calc(var(--rule) - 1px),var(--paper-line) var(--rule)),
                   linear-gradient(to right,transparent 0 33px,color-mix(in oklab,var(--rose) 45%,transparent) 33px 34px,transparent 34px);
  background-attachment:local;}

/* Schrift-Sets */
.blk,.page-title{font-family:var(--font-read,var(--font-ui))}
.blk span.ff{font-family:inherit}
.blk span.ff[style*="font-family"]{font-family:revert}
h1.blk,h2.blk,h3.blk,.page-title{font-family:var(--font-display)}
.blk{font-size:var(--read-size,15px)}
.brow[data-t="quote"] .blk{font-size:calc(var(--read-size,15px) + 1.5px)}

/* Auswahlflächen in den Einstellungen */
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;background:none;border:0;padding:4px 2px;border-radius:var(--r-m);transition:var(--t)}
.sw:hover{background:var(--surface-2)}
.sw .sw-c{width:34px;height:22px;border-radius:7px 7px 0 0;border:1px solid var(--line);border-bottom:0;display:block}
.sw .sw-c.d{height:12px;border-radius:0 0 7px 7px;border-top:0;border-bottom:1px solid var(--line)}
.sw .sw-n{font-size:10.5px;color:var(--tx-3);line-height:1.2;text-align:center}
.sw.on{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sw.on .sw-n{color:var(--tx)}
.pat-p{position:absolute;inset:0;display:block}
.pat[data-pattern] .pat-p{--paper-line:rgba(128,128,128,.45);--paper-line-2:rgba(128,128,128,.22)}
.pat-p[data-p="lines"]{background-image:repeating-linear-gradient(to bottom,transparent 0 7px,var(--paper-line) 7px 8px)}
.pat-p[data-p="grid"]{background-image:repeating-linear-gradient(to bottom,transparent 0 7px,var(--paper-line) 7px 8px),repeating-linear-gradient(to right,transparent 0 7px,var(--paper-line) 7px 8px)}
.pat-p[data-p="dots"]{background-image:radial-gradient(circle,var(--paper-line) 1.1px,transparent 1.1px);background-size:9px 9px}
.pat-p[data-p="graph"]{background-image:repeating-linear-gradient(to bottom,transparent 0 15px,var(--paper-line) 15px 16px),repeating-linear-gradient(to right,transparent 0 15px,var(--paper-line) 15px 16px),repeating-linear-gradient(to bottom,transparent 0 4px,var(--paper-line-2) 4px 5px),repeating-linear-gradient(to right,transparent 0 4px,var(--paper-line-2) 4px 5px)}
.pat-p[data-p="cross"]{background-image:repeating-linear-gradient(to bottom,transparent 0 4px,var(--paper-line-2) 4px 5px),repeating-linear-gradient(to right,transparent 0 4px,var(--paper-line-2) 4px 5px)}
.pat-p[data-p="margin"]{background-image:repeating-linear-gradient(to bottom,transparent 0 7px,var(--paper-line) 7px 8px),linear-gradient(to right,transparent 0 15px,color-mix(in oklab,var(--rose) 55%,transparent) 15px 16px,transparent 16px)}
.pat span:not(.pat-p){z-index:2}

.pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin:6px 0}
.pat{height:62px;border:1px solid var(--line);border-radius:var(--r-m);cursor:pointer;position:relative;overflow:hidden;background:var(--surface-2);transition:var(--t)}
.pat:hover{border-color:var(--brass-line)}
.pat.on{box-shadow:inset 0 0 0 2px var(--accent)}
.pat span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:color-mix(in oklab,var(--surface) 82%,transparent);color:var(--tx-3)}
.font-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px;margin:6px 0}
.fnt{border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;cursor:pointer;text-align:left;background:var(--surface);transition:var(--t)}
.fnt:hover{border-color:var(--brass-line)}
.fnt.on{box-shadow:inset 0 0 0 2px var(--accent)}
.fnt b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.fnt span{font-size:12px;color:var(--tx-3)}

/* Tresor */
.lock-wrap{max-width:430px;margin:8vh auto;text-align:center;padding:0 20px}
.lock-ico{font-size:38px;margin-bottom:12px}
.lock-wrap h3{font-family:var(--font-display);font-size:22px;margin:0 0 6px;font-weight:600}
.lock-wrap p{color:var(--tx-3);font-size:13.5px;margin:0 0 18px}
.lock-form{display:flex;gap:8px}
.lock-form input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:14px}
.lock-form input:focus{outline:none;border-color:var(--accent)}
.lock-err{color:var(--rose);font-size:12.5px;margin-top:10px;min-height:16px}
.t-lock{font-size:10px;color:var(--tx-3);margin-left:4px}
.badge-lock{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;
  background:color-mix(in oklab,var(--violet) 16%,transparent);border:1px solid color-mix(in oklab,var(--violet) 40%,transparent);color:var(--violet)}


/* =========================================================================
   Dokument-Darstellung: eine Seite im Stil von „Konzept & Doku“
   ========================================================================= */
.pad.as-doc{--doc-w:880px}
.as-doc .page-head{padding-top:52px}
.as-doc .page-title{font-size:clamp(34px,5vw,58px);line-height:1.04;letter-spacing:-.02em}
.as-doc .page-meta{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.as-doc .blocks{counter-reset:sec}
.as-doc .brow[data-t="h2"]{flex-wrap:wrap;counter-increment:sec}
.as-doc .brow[data-t="h2"]::before{
  content:counter(sec,decimal-leading-zero);flex-basis:100%;order:-1;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);
  margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.as-doc .brow[data-t="h2"] .blk{font-size:30px;padding-top:2px}
.as-doc .brow[data-t="h3"] .blk{font-size:19px;padding-top:18px}
.as-doc .blk[data-t="p"]{font-size:calc(var(--read-size,15px) + 1px);line-height:1.72;color:var(--tx-2);max-width:70ch}
.as-doc .blocks>.brow:first-child .blk[data-t="p"]{font-size:calc(var(--read-size,15px) + 3px);line-height:1.6;color:var(--tx-2)}
.as-doc .brow[data-t="quote"] .blk{font-size:calc(var(--read-size,15px) + 3px);line-height:1.5}
.as-doc .brow[data-t="callout"] .callout{border-left-width:3px}
.as-doc .brow[data-t="bullet"] .blk,.as-doc .brow[data-t="num"] .blk{color:var(--tx-2)}
@media (max-width:820px){ .as-doc .brow[data-t="h2"]::before{margin-top:26px;padding-top:16px} .as-doc .page-title{font-size:30px} }

/* Menüs erscheinen am Handy als Blatt von unten statt schwebend am Text */
.pop.sheet{left:8px;right:8px;width:auto;min-width:0;max-height:46vh;border-radius:16px;
  box-shadow:0 -14px 40px -12px rgba(0,0,0,.6);animation:sheetUp .16s ease}
.pop.sheet .pop-item{padding:12px 12px}
.pop.sheet .pop-lbl{position:sticky;top:0;background:var(--surface);padding-top:10px}
@keyframes sheetUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Werkzeugleiste über der Tastatur (Touch) */
#dock{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:75;display:flex;align-items:center;gap:6px;
  padding:7px 8px;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);box-shadow:0 -8px 24px -14px rgba(0,0,0,.6)}
#dock[hidden]{display:none}
.dock-scroll{flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.dock-scroll::-webkit-scrollbar{display:none}
.dock-grp{display:flex;gap:4px;flex:none}
.dock-sep{width:1px;height:22px;background:var(--line);flex:none}
#dock button{min-width:38px;height:38px;padding:0 9px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-soft);
  color:var(--tx-2);font-size:14px;display:grid;place-items:center;flex:none;transition:var(--t)}
#dock button:active{background:var(--accent);color:var(--accent-tx);transform:scale(.94)}
#dock .dis{opacity:.35}
#dockClose{flex:none;min-width:38px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-soft);color:var(--tx-3)}
body.dock-on{--dock-h:54px}
body.dock-on #view{padding-bottom:var(--dock-h)}

/* Zusammenarbeit */
#peers{display:flex;align-items:center;gap:-6px;margin-left:10px}
.peer{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;
  color:#1A1710;border:2px solid var(--bg);margin-left:-6px;font-family:var(--font-mono);letter-spacing:0;flex:none;transition:var(--t)}
.peer.ich{box-shadow:0 0 0 1px var(--accent)}
.peer.hier{transform:translateY(-1px);box-shadow:0 0 0 2px var(--teal)}
.peer-n{margin-left:9px;font-size:10.5px;color:var(--tx-3)}
.room-card{border:1px solid var(--line);border-radius:var(--r-m);padding:16px;background:var(--surface);margin:14px 0}
.room-live{border-color:var(--brass-line);box-shadow:inset 3px 0 0 var(--accent)}
.room-in{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.room-in input{flex:1;min-width:170px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);font-size:14px}
.peer-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.peer-row .peer{margin-left:0}
.peer-row .wo{margin-left:auto;font-size:12px;color:var(--tx-3)}

/* Ziehen mit Finger */
#dragGhost{position:fixed;z-index:300;display:none;pointer-events:none;background:var(--surface);border:1px solid var(--brass-line);
  border-left:3px solid var(--accent);border-radius:var(--r-s);padding:6px 11px;font-size:12.5px;max-width:230px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow);color:var(--tx-2)}
[data-grip],.card,.tree-row{touch-action:pan-y}
.bctl .grip{touch-action:none}

/* Responsive */
@media (max-width:1180px){#app{grid-template-columns:var(--side-w) minmax(0,1fr) 0}#rail{display:none}}
@media (max-width:820px){
  /* Die Seitenleiste liegt hier fest über dem Inhalt und zählt nicht mehr als Rasterspalte —
     deshalb genau EINE Spalte, sonst rutscht der Hauptbereich in eine 0-Pixel-Spalte. */
  #app,#app.no-side,#app.no-rail,#app.no-side.no-rail{grid-template-columns:minmax(0,1fr)}
  /* Rand des Geräts respektieren (Notch, Home-Balken) */
  #topbar{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  #sidebar{padding-bottom:env(safe-area-inset-bottom)}
  #dock{padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  .pad{padding-bottom:46vh}
  /* Lange Inhalte dürfen die Seite nicht sprengen */
  .matrix{display:block;overflow-x:auto;white-space:nowrap}
  .matrix td{white-space:normal;min-width:150px}
  .matrix td:first-child{min-width:110px}
  pre.blueprint{font-size:10.5px;line-height:1.5;padding:12px}
  .doc h2{font-size:23px} .doc h3{font-size:17px}
  .hero .kicker{flex-wrap:wrap}
  .kcard{padding:14px}
  .room-in input{min-width:0}
  .t-line{font-size:11.5px;word-break:break-word}
  /* Gliederung und Rückverweise als Blatt statt fester Spalte */
  #app.rail-sheet #rail{display:block;position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:62vh;
    z-index:78;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding-bottom:calc(14px + env(safe-area-inset-bottom));animation:sheetUp .16s ease}
  #app.rail-sheet::after{content:"";position:fixed;inset:0;background:rgba(8,7,12,.5);z-index:77}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:90;transform:translateX(-100%);transition:transform var(--t);display:flex}
  #app.side-open #sidebar{transform:none;box-shadow:var(--shadow)}
  #app.side-open #main::after{content:"";position:fixed;inset:0;background:rgba(8,7,12,.5);z-index:80}
  #app.no-side #sidebar{display:flex}
  /* Platz für die Blockgriffe, sonst liegen sie außerhalb des Bildschirms */
  .pad{padding:0 14px 40vh 40px}
  .doc{padding-left:18px;padding-right:18px}
  .bctl{left:-36px;opacity:1;flex-direction:column;gap:0}
  .bctl .ad{display:none}
  .bctl button{width:26px;height:26px}
  .page-title{font-size:29px}
  .page-icon{font-size:42px}
  .hero{padding:30px 0 24px}
  .hero h1{font-size:34px}
  .phase{grid-template-columns:1fr;gap:4px}
  .kbd-grid{grid-template-columns:1fr}
  /* größere Tippflächen */
  .vtab{padding:9px 12px;font-size:13.5px}
  .tbtn{padding:8px 11px;font-size:13px}
  .nav-row,.tw{padding-top:9px;padding-bottom:9px}
  .cell{min-height:42px}
  .pop-item,.res{padding:11px 10px}
  .tbl-scroll{-webkit-overflow-scrolling:touch}
  .bcol{width:min(72vw,270px)}
  .cal .day{min-height:64px}
  .modal{width:94vw} .scrim{padding-top:8vh}
  #topbar{height:52px}
  .icon-btn{width:34px;height:34px}
  #seltool button{padding:9px 11px}
}
@media (max-width:420px){
  .pad{padding-left:34px}
  .bctl{left:-31px}
  .gal{grid-template-columns:1fr}
  .db-bar{gap:2px}
  .hero h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}

<!-- ============================ Konzept-Dokument ============================ -->
<template id="tpl-concept">
<article class="doc">

  <header class="hero">
    <div class="kicker"><span class="chip"><span class="dot"></span> Konzept v1.0</span><span class="eyebrow">Persönliche Wissens-App · eine Datei · offline</span></div>
    <h1>Eine Notiz-App, die dir <em>gehört</em>.</h1>
    <p class="lead">KODEX ist der Bauplan und zugleich der laufende Prototyp einer persönlichen Wissens-App: Block-Editor, Datenbanken mit fünf Ansichten, Formeln, Vorlagen, Volltextsuche, Kommandoleiste, zehn Pastell-Papiertöne mit Linien- und Karomustern — und echte Verschlüsselung für einzelne Seiten oder alles auf einmal. Dazu Räume, in denen mehrere Leute gleichzeitig dieselben Seiten bearbeiten. Kein Konto, kein Abo — alles in dieser einen HTML-Datei.</p>
    <div class="hero-actions">
      <button class="btn" data-go="demo">Prototyp öffnen</button>
      <button class="btn ghost" data-scroll="matrix">Funktionsmatrix ansehen</button>
      <button class="btn ghost" data-go="tests">Selbsttest starten</button>
    </div>
  </header>

  <div class="sec-lead"><span class="n">01</span><h2>Leitidee</h2></div>
  <p>Viele Wissens-Apps sind Mietobjekte: Notizen liegen auf fremden Servern, Funktionen hängen am Tarif, ohne Netz wird es zäh. KODEX dreht das um. Vier Prinzipien bestimmen jede Designentscheidung:</p>
  <div class="card-grid">
    <div class="kcard"><span class="eyebrow">Prinzip 1</span><h4>Deine Daten, dein Ordner</h4><p>Ein JSON-Zustand, den du jederzeit als Sicherung herunterlädst. Kein Lock-in, kein Export-Assistent — die Datei <em>ist</em> das Format.</p></div>
    <div class="kcard"><span class="eyebrow">Prinzip 2</span><h4>Tastatur zuerst</h4><p>Alles Wichtige erreichst du mit <kbd>Strg K</kbd>, <kbd>/</kbd> und Markdown-Kürzeln. Die Maus ist optional, nicht Voraussetzung.</p></div>
    <div class="kcard"><span class="eyebrow">Prinzip 3</span><h4>Struktur statt Ordner</h4><p>Jede Zeile einer Datenbank ist eine vollwertige Seite. Verknüpfungen, Rollups und Backlinks ersetzen Ordnerbäume.</p></div>
    <div class="kcard"><span class="eyebrow">Prinzip 4</span><h4>Für eine Person gebaut</h4><p>Keine Rechteverwaltung, keine Teamspaces, keine Einladungen. Weniger Oberfläche, mehr Tempo.</p></div>
    <div class="kcard"><span class="eyebrow">Prinzip 5</span><h4>Privat heißt verschlüsselt</h4><p>Was nur dich angeht, wird mit AES-256 abgeschlossen — einzelne Seiten oder der ganze Arbeitsbereich, mit Sperrbildschirm beim Öffnen.</p></div>
    <div class="kcard"><span class="eyebrow">Prinzip 6</span><h4>Sieht aus wie deins</h4><p>Papierton, Hintergrundmuster und Schriftbild frei wählbar. Ein Werkzeug für den Alltag darf Charakter haben.</p></div>
  </div>

  <div class="sec-lead" id="matrix"><span class="n">02</span><h2>Funktionsmatrix</h2></div>
  <p>Elf Funktionsbereiche moderner Wissens-Apps, gegenübergestellt mit dem, was der Prototyp in dieser Datei bereits kann. <span class="st ok">läuft</span> ist im Prototyp benutzbar, <span class="st part">reduziert</span> ist bewusst vereinfacht, <span class="st plan">geplant</span> steht in der Roadmap.</p>
  <table class="matrix">
    <thead><tr><th>Bereich</th><th>Umsetzung in KODEX</th><th>Stand</th></tr></thead>
    <tbody>
      <tr><td>1 · Seiten &amp; Inhalte</td><td>Block-Editor mit Absatz, H1–H3, Aufzählung, Nummerierung, To-do, Zitat, Callout, Toggle, Code, Trenner, Bild, Lesezeichen. Verschachtelung über drei Einrückungsstufen, Unterseiten beliebig tief.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>2 · Datenbanken</td><td>Fünf Ansichten (Tabelle, Board, Kalender, Liste, Galerie) auf demselben Datensatz. Property-Typen: Text, Auswahl, Mehrfachauswahl, Status, Datum, Zahl, Währung, Kontrollkästchen, URL, Person, Relation, Rollup, Formel, Erstellt/Geändert.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>3 · Projekte &amp; Aufgaben</td><td>Filter, Sortierung, Gruppierung und gespeicherte Ansichten pro Datenbank. Fälligkeiten, Prioritäten, Status-Board mit Ziehen &amp; Ablegen.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>4 · Wissen &amp; Wiki</td><td>Verlinkung über <code>[[Seitenname]]</code>, automatische Rückverweise in der rechten Leiste, Volltextsuche über Titel und Blöcke.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>5 · Zusammenarbeit</td><td>Räume für gemeinsames Bearbeiten in Echtzeit, Anwesenheitsanzeige, blockweise Zusammenführung ohne Datenverlust — live über den Browser oder ein eigenes Relais, notfalls per Dateiabgleich ganz ohne Netz. Kommentar-Threads fehlen weiterhin.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>6 · Formulare &amp; Intake</td><td>Schnellerfassung über die Kommandoleiste: neue Zeile in einer Datenbank anlegen, ohne die Ansicht zu wechseln.</td><td><span class="st part">reduziert</span></td></tr>
      <tr><td>7 · Automatisierungen</td><td>Regel „wenn Status = Fertig, dann Enddatum setzen“ ist als Datenbank-Regel eingebaut. Frei konfigurierbare Regeln folgen in Phase 2.</td><td><span class="st part">reduziert</span></td></tr>
      <tr><td>8 · Integrationen</td><td>Ohne Netz keine Fremddienste. Stattdessen: Markdown- und JSON-Import/Export als universelle Schnittstelle.</td><td><span class="st part">reduziert</span></td></tr>
      <tr><td>9 · KI-Funktionen</td><td>Vorbereitet als austauschbare Schnittstelle (Zusammenfassen, Gliedern, Aufgaben ableiten). Im Offline-Prototyp deaktiviert.</td><td><span class="st plan">geplant</span></td></tr>
      <tr><td>10 · Vorlagen</td><td>Seiten-Vorlagen und Datenbank-Zeilenvorlagen, eigene Seiten per Klick zur Vorlage machen.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>11 · Import/Export &amp; Teilen</td><td>Seite als Markdown exportieren, kompletter Arbeitsbereich als JSON sichern und zurückspielen. Drucken erzeugt ein sauberes PDF-Layout.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>12 · Darstellung</td><td>Zehn Pastell-Papiertöne, sechs Hintergrundmuster (liniert, kariert, Punkte, Millimeter, feines Karo), sieben Schriftbilder, vier Schriftgrößen — frei kombinierbar, hell wie dunkel.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>12b · Zeichenweise Schrift</td><td>Schriftart und Größe lassen sich für markierten Text setzen — bis hinunter auf einen einzelnen Buchstaben. Typische Wissens-Apps bieten nur Fett, Kursiv und Code.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>13 · Schutz</td><td>Einzelne Seiten und der gesamte Arbeitsbereich lassen sich mit einem Passwort verschlüsseln (AES-256-GCM, PBKDF2). Bei vergleichbaren Wissens-Apps fehlt das meist ganz.</td><td><span class="st ok">läuft</span></td></tr>
      <tr><td>14 · Dokument-Modus</td><td>Jede Seite kann auf Knopfdruck wie ein gesetztes Papier erscheinen — großer Titel, Vorspann, automatisch nummerierte Abschnitte. Genau die Darstellung, die du gerade liest.</td><td><span class="st ok">läuft</span></td></tr>
    </tbody>
  </table>

  <div class="sec-lead"><span class="n">03</span><h2>Datenmodell</h2></div>
  <p>Ein einziger Zustandsbaum, serialisierbar, versioniert. Alles andere ist abgeleitete Ansicht — Suche, Rückverweise, Rollups und die Gliederung werden zur Laufzeit berechnet und nie gespeichert.</p>
  <pre class="blueprint"><b>state</b> {
  version: 1,
  settings: { theme, docWidth, font, showRail },
  pages: {
    "p_a1b2": {
      id, parentId, order, type: <b>"doc" | "db"</b>,
      title, icon, cover, favorite, template, trashed,
      createdAt, updatedAt,
      blocks: [ <b>Block</b> ],          // nur bei type = doc
      db: <b>Database</b>                // nur bei type = db
    }
  }
}

<b>Block</b> { id, type, text, indent, checked?, collapsed?, lang?, url?, icon? }
   type ∈ p | h1 | h2 | h3 | bullet | num | todo | quote
          callout | toggle | code | divider | image | bookmark

<b>Database</b> {
  props: [ { id, name, type, options[], formula?, relTo?, rollup? } ],
  rows:  [ { id, pageId, values: { propId: any }, createdAt } ],
  views: [ { id, name, kind, groupBy, filters[], sorts[], hidden[] } ]
}
   kind ∈ table | board | calendar | list | gallery</pre>
  <p><strong>Warum flach statt verschachtelt?</strong> Blöcke liegen als flache Liste mit <code>indent</code>-Stufe statt als Baum. Das macht Einfügen, Verschieben und Ziehen zu einem Array-Splice statt zu einer Baumoperation — deutlich weniger Fehlerquellen, und die Darstellung bleibt identisch.</p>

  <div class="sec-lead"><span class="n">04</span><h2>Architektur</h2></div>
  <pre class="blueprint">┌───────────────────────────────────────────────────────────┐
│  <b>Oberfläche</b>   Seitenleiste · Kopfzeile · Ansicht · Rücken │
├───────────────────────────────────────────────────────────┤
│  <b>Ansichten</b>    Editor  │  Datenbank  │  Konzept │ Tests   │
├───────────────────────────────────────────────────────────┤
│  <b>Kern</b>         Blockoperationen · Filter · Sortierung ·   │
│               Gruppierung · Formel-Auswertung · Suchindex │
├───────────────────────────────────────────────────────────┤
│  <b>Zustand</b>      ein Objekt · Änderung → Zeichnen → Sichern │
├───────────────────────────────────────────────────────────┤
│  <b>Speicher</b>     Artefakt-Speicher → localStorage → RAM     │
└───────────────────────────────────────────────────────────┘</pre>
  <p>Die Kernschicht besteht ausschließlich aus reinen Funktionen: gleiche Eingabe, gleiche Ausgabe, kein DOM. Genau deshalb lässt sie sich vollständig testen — der Selbsttest in dieser Datei prüft sie bei jedem Start.</p>

  <div class="sec-lead"><span class="n">05</span><h2>Editor-Mechanik</h2></div>
  <h3>Schreiben ohne Werkzeugleiste</h3>
  <ul>
    <li><code>#</code> · <code>##</code> · <code>###</code> + Leerzeichen → Überschriften</li>
    <li><code>-</code> oder <code>*</code> + Leerzeichen → Aufzählung, <code>1.</code> → Nummerierung</li>
    <li><code>[]</code> + Leerzeichen → To-do, <code>&gt;</code> → Zitat, <code>```</code> → Code, <code>---</code> → Trenner</li>
    <li><code>[[</code> öffnet die Seitenverknüpfung, <code>/</code> öffnet den Blockwähler</li>
  </ul>
  <h3>Wörter zu Seiten machen</h3>
  <p>Jedes Wort im Text kann eine eigene Seite werden. Markieren, den Knopf <strong>⧉</strong> antippen — fertig: Es entsteht eine Unterseite mit diesem Namen, und das Wort wird zum Verweis darauf. Existiert bereits eine Seite mit dem Namen, wird stattdessen mit ihr verknüpft, statt eine zweite anzulegen.</p>
  <p>Im Text steht technisch <code>[[Wort]]</code>, sichtbar ist aber nur das Wort selbst — die Klammern erscheinen ausschließlich, während der Cursor in genau diesem Block steht. So bleibt der Text beim Lesen ruhig und beim Bearbeiten trotzdem ehrlich: Du siehst, womit du es zu tun hast, und kannst die Verknüpfung wie normalen Text löschen.</p>
  <p>Ein Klick öffnet die Seite. Zeigt ein Verweis auf etwas, das es noch nicht gibt, wird die Seite beim ersten Klick angelegt — als Unterseite dort, wo der Verweis steht. Damit wächst die Struktur beim Schreiben, statt vorher geplant werden zu müssen.</p>

  <h3>Am Handy: andocken statt schweben</h3>
  <p>Auf dem Rechner erscheint die Formatierleiste direkt über dem markierten Text. Am Handy geht das nicht: Sobald man etwas markiert, legt das Betriebssystem seine eigene Leiste mit Ausschneiden, Kopieren und Einfügen genau dorthin — und verdeckt alles darunter. Diese Systemleiste lässt sich von einer Webseite aus weder verschieben noch abschalten.</p>
  <p>Deshalb wechselt KODEX bei Touch-Bedienung die Strategie: Die Werkzeugleiste dockt unten an, direkt über der Bildschirmtastatur, deren Höhe über die Viewport-Schnittstelle ausgelesen wird. Sie kollidiert damit nie mit dem Systemmenü, ist immer an derselben Stelle und bietet mehr Platz — Formatierung, Blocktypen, Ein- und Ausrücken auf einen Griff, ohne den Umweg über <code>/</code>. Menüs erscheinen aus demselben Grund als Blatt von unten statt als Fenster am Text.</p>

  <h3>Warum ein Block pro contenteditable</h3>
  <p>Ein einziges großes editierbares Feld klingt einfacher, wird aber unbeherrschbar: Der Browser entscheidet dann selbst über Struktur, und jede Einfügeaktion erzeugt fremde Elemente. KODEX gibt jedem Block sein eigenes editierbares Feld. Der Cursor wandert zwischen Blöcken per Pfeiltaste, Text kommt beim Einfügen grundsätzlich unformatiert an, und der Zustand bleibt exakt das, was gespeichert wird.</p>

  <div class="sec-lead"><span class="n">06</span><h2>Datenbank-Engine</h2></div>
  <p>Vier reine Funktionen erzeugen jede Ansicht: <code>filter → sort → group → render</code>. Die Ansicht speichert nur Regeln, nie Ergebnisse.</p>
  <h3>Formeln</h3>
  <p>Ein eigener Rechenkern mit Zerlegung, Syntaxbaum und Auswertung — kein <code>eval</code>, damit eine kaputte Formel nur eine Zelle stört und nicht die App.</p>
  <pre class="blueprint">if(prop("Status") == "Fertig", 100, round(prop("Fortschritt") * 100))
concat(prop("Fach"), " · ", prop("Note"))
prop("Preis") * 1.19</pre>
  <p>Unterstützt: <code>+ − × ÷ %</code>, Vergleiche, <code>und</code>/<code>oder</code>/<code>nicht</code>, sowie <code>prop, if, round, floor, ceil, abs, min, max, length, concat, upper, lower, contains, empty, number, now, dateDiff</code>.</p>

  <div class="sec-lead"><span class="n">07</span><h2>Speicher &amp; Sicherung</h2></div>
  <p>Gespeichert wird verzögert: eine halbe Sekunde nach der letzten Eingabe, damit Tippen nie ins Stocken gerät. Die Speicherschicht probiert drei Wege in dieser Reihenfolge und meldet unten links, welcher greift.</p>
  <ol>
    <li><strong>Artefakt-Speicher</strong> — wenn die Datei in Claude läuft, überlebt der Stand die Sitzung.</li>
    <li><strong>localStorage</strong> — wenn du die Datei heruntergeladen hast und lokal öffnest.</li>
    <li><strong>Arbeitsspeicher</strong> — Notfallmodus; dann bitte per Knopf unten links sichern.</li>
  </ol>
  <div class="note"><strong>Empfehlung für den Dauerbetrieb:</strong> Lade die Datei herunter und lege sie in einen Ordner, der ohnehin gesichert wird. Einmal pro Woche „Sicherung herunterladen“ — das JSON ist deine echte Versicherung, unabhängig vom Browser.</div>

  <div class="sec-lead"><span class="n">08</span><h2>Tastatur</h2></div>

    <div class="kbd-row">Kommandoleiste öffnen <kbd>Strg K</kbd></div>
    <div class="kbd-row">Volltextsuche <kbd>Strg Shift F</kbd></div>
    <div class="kbd-row">Neue Seite <kbd>Strg Alt N</kbd></div>
