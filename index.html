    eq('Zitat',blocksToMarkdown([{type:'quote',text:'z',indent:0}]),'> z');
    eq('Trenner',blocksToMarkdown([{type:'divider',text:'',indent:0}]),'---');
    eq('Code mit Sprache',blocksToMarkdown([{type:'code',text:'x=1',indent:0,lang:'js'}]),'```js\nx=1\n```');
    eq('Auszeichnung fällt weg',blocksToMarkdown([{type:'p',text:'<b>fett</b>',indent:0}]),'fett');
    eq('Bild',blocksToMarkdown([{type:'image',text:'Alt',indent:0,url:'u.png'}]),'![Alt](u.png)');
    eq('Hinweis',blocksToMarkdown([{type:'callout',text:'h',indent:0,icon:'⚡'}]),'> ⚡ h');
    eq('zwei Blöcke mit Leerzeile',blocksToMarkdown([{type:'p',text:'a',indent:0},{type:'p',text:'b',indent:0}]),'a\n\nb');
    eq('leere Liste ergibt leeren Text',blocksToMarkdown([]),'');
  });

  /* --- Zustand und Baum --- */
  group('Seitenbaum',function(eq,ok){
    const SAVED=S, SAVEDR=route;
    S={version:1,settings:{},pages:{}};
    const a=newPage({title:'A'}), b=newPage({title:'B',parentId:a.id}), c=newPage({title:'C',parentId:b.id});
    eq('Kinder werden gefunden',kids(a.id).map(p=>p.id),[b.id]);
    eq('Pfad ist vollständig',pathOf(c.id).map(p=>titleOf(p)),['A','B','C']);
    const anon=newPage({});
    eq('Titel weicht auf Platzhalter aus',titleOf(anon),'Ohne Titel');
    delete S.pages[anon.id];
    ok('Enkel ist Nachfahre',isDescendant(a.id,c.id));
    ok('Elternteil ist kein Nachfahre des Kindes',!isDescendant(c.id,a.id));
    ok('Seite ist ihr eigener Nachfahre',isDescendant(a.id,a.id));
    b.trashed=true;
    eq('Papierkorb blendet aus dem Baum aus',kids(a.id).length,0);
    b.trashed=false;
    const s1=searchAll('B');
    ok('Suche findet nach Titel',s1.length>0);
    eq('Suche ohne Begriff bleibt leer',searchAll('').length,0);
    eq('Suche ohne Treffer bleibt leer',searchAll('zzzz').length,0);
    a.blocks=[blk('p','Verweis auf [[B]]')];
    eq('Rückverweis wird erkannt',backlinksTo(b).length,1);
    eq('kein Rückverweis auf C',backlinksTo(c).length,0);
    const st=stats(a);
    ok('Kennzahlen liefern Blockzahl',/Blöcke/.test(st.a));
    a.order=5;b.order=3;b.parentId=null;c.parentId=null;c.order=9;
    normalizeOrder();
    eq('Reihenfolge wird lückenlos',[b.order,a.order,c.order],[0,1,2]);
    S=SAVED; route=SAVEDR;
  });

  /* --- Zusammenführen --- */
  group('Zusammenführen',function(eq,ok){
    const B=function(id,text,at,by,extra){ return Object.assign({id:id,type:'p',text:text,indent:0,at:at||1000,by:by||'A'},extra||{}); };
    const P=function(id,rev,upd,by,blocks){ return {id:id,parentId:null,order:0,type:'doc',title:id,icon:'x',rev:rev,updatedAt:upd,by:by,blocks:blocks,trashed:false}; };

    /* Wer zuletzt geschrieben hat, gewinnt */
    eq('höherer Zählstand gewinnt',neuer({rev:2,updatedAt:1},{rev:1,updatedAt:9}).rev,2);
    eq('bei gleichem Stand entscheidet die Zeit',neuer({rev:1,updatedAt:5},{rev:1,updatedAt:9}).updatedAt,9);
    eq('bei Gleichstand entscheidet die Kennung',neuer({rev:1,updatedAt:1,by:'B'},{rev:1,updatedAt:1,by:'A'}).by,'B');
    ok('Entscheidung ist auf beiden Geräten gleich',neuer({rev:1,updatedAt:1,by:'A'},{rev:1,updatedAt:1,by:'B'}).by===neuer({rev:1,updatedAt:1,by:'B'},{rev:1,updatedAt:1,by:'A'}).by);

    /* Blöcke einzeln */
    const a1=[B('b1','Anna eins',2000,'A'),B('b2','gemeinsam',1000,'A')];
    const b1=[B('b1','alt',1000,'B'),B('b2','Bea zwei',3000,'B')];
    const m=mergeBlocks(a1,b1,'hier');
    eq('jüngere Fassung je Block',m.map(x=>strip(x.text)),['Anna eins','Bea zwei']);
    eq('Blockzahl bleibt',m.length,2);

    /* Neuer Block der Gegenseite landet hinter seinem Vorgänger */
    const a2=[B('b1','eins'),B('b3','drei')];
    const b2=[B('b1','eins'),B('b2','zwei',1000,'B',{after:'b1'}),B('b3','drei')];
    eq('fremder Block wird eingefügt',mergeBlocks(a2,b2,'hier').map(x=>x.id),['b1','b2','b3']);
    eq('ohne Vorgänger hinten anhängen',mergeBlocks([B('b1','x')],[B('b9','neu',1,'B')],'hier').map(x=>x.id),['b1','b9']);

    /* Gleichzeitiges Schreiben in verschiedene Blöcke geht nicht verloren */
    const seiteA=P('p1',5,5000,'A',[B('b1','Anna schreibt hier',5000,'A'),B('b2','unverändert',1000,'A')]);
    const seiteB=P('p1',5,5000,'B',[B('b1','alt',1000,'B'),B('b2','Bea schreibt dort',5000,'B')]);
    const z=mergePage(seiteA,seiteB,{konflikte:0});
    eq('beide Änderungen überleben',z.blocks.map(x=>strip(x.text)),['Anna schreibt hier','Bea schreibt dort']);

    /* Ganze Arbeitsbereiche */
    const L={version:1,settings:{theme:'dark'},pages:{p1:P('p1',1,1000,'A',[B('b1','lokal')]),p2:P('p2',1,1000,'A',[B('b9','nur hier')])}};
    const F={version:1,settings:{theme:'light'},pages:{p1:P('p1',3,3000,'B',[B('b1','fremd neuer',3000,'B')]),p3:P('p3',1,1000,'B',[B('b7','neu von drüben')])}};
    const e=mergeStates(L,F);
    eq('alle Seiten sind da',Object.keys(e.state.pages).sort(),['p1','p2','p3']);
    eq('fremde Seite wird gezählt',e.stat.neu,1);
    eq('eigene bleibt erhalten',strip(e.state.pages.p2.blocks[0].text),'nur hier');
    eq('jüngere Fassung gewinnt',strip(e.state.pages.p1.blocks[0].text),'fremd neuer');
    eq('Einstellungen bleiben lokal',e.state.settings.theme,'dark');
    ok('Ausgangsstand bleibt unberührt',strip(L.pages.p1.blocks[0].text)==='lokal');

    /* Zweimal zusammenführen ändert nichts mehr */
    const e2=mergeStates(e.state,F);
    eq('zweiter Durchlauf ist stabil',JSON.stringify(Object.keys(e2.state.pages).sort()),JSON.stringify(['p1','p2','p3']));
    eq('kein Zuwachs beim Wiederholen',e2.state.pages.p1.blocks.length,e.state.pages.p1.blocks.length);

    /* Reihenfolge egal: A+B ergibt dasselbe wie B+A */
    const x1=mergeStates(L,F).state, x2=mergeStates(F,L).state;
    eq('Zusammenführen ist richtungsunabhängig',
       Object.keys(x1.pages).sort().map(k=>x1.pages[k].blocks.map(b=>strip(b.text)).join('|')).join('/'),
       Object.keys(x2.pages).sort().map(k=>x2.pages[k].blocks.map(b=>strip(b.text)).join('|')).join('/'));

    /* Datenbankzeilen */
    const dbA={id:'d1',parentId:null,order:0,type:'db',title:'D',icon:'x',rev:1,updatedAt:1000,by:'A',
      db:{props:[{id:'c1',name:'Name',type:'title'}],rows:[{id:'r1',at:1000,values:{c1:'alt'}},{id:'r2',at:1000,values:{c1:'bleibt'}}],views:[{id:'v1',name:'T',kind:'table',filters:[],sorts:[],hidden:[]}]}};
    const dbB={id:'d1',parentId:null,order:0,type:'db',title:'D',icon:'x',rev:2,updatedAt:2000,by:'B',
      db:{props:[{id:'c1',name:'Name',type:'title'},{id:'c2',name:'Neu',type:'text'}],rows:[{id:'r1',at:9000,values:{c1:'neu'}},{id:'r3',at:2000,values:{c1:'dazu'}}],views:[{id:'v2',name:'Board',kind:'board',filters:[],sorts:[],hidden:[]}]}};
    const dz=mergePage(dbA,dbB,null);
    eq('Zeilen werden vereinigt',dz.db.rows.map(r=>r.id).sort(),['r1','r2','r3']);
    eq('jüngere Zeile gewinnt',dz.db.rows.filter(r=>r.id==='r1')[0].values.c1,'neu');
    eq('Spalten gehen niemandem verloren',dz.db.props.length,2);
    eq('Ansichten werden vereinigt',dz.db.views.length,2);

    /* Papierkorb */
    const gA=P('p9',1,1000,'A',[B('b1','da')]);
    const gB=P('p9',2,2000,'B',[B('b1','da')]); gB.trashed=true;
    ok('Löschen setzt sich durch, wenn es jünger ist',mergePage(gA,gB,null).trashed===true);
    const gC=P('p9',5,5000,'A',[B('b1','doch behalten')]);
    ok('Wiederherstellen schlägt älteres Löschen',mergePage(gC,gB,null).trashed===false);
  });

  const total=groups.reduce((a,g)=>a+g.ok+g.fail,0), fails=groups.reduce((a,g)=>a+g.fail,0);
  return{groups:groups,total:total,fails:fails,ok:total-fails};
}
function viewTests(){
  const r=runTests();
  return '<div class="doc"><div class="sec-lead" style="margin-top:36px"><span class="n">'+(r.fails?'FEHLER':'OK')+'</span><h2>Selbsttest</h2></div>'+
    '<p>Geprüft wird der Rechenkern: Formeln, Filter, Sortierung, Gruppierung, Markdown-Kürzel, Export und Baumlogik. Die Oberfläche bleibt außen vor, weil sie sich ändert — die Logik darunter nicht.</p>'+
    '<div class="t-sum"><div><div class="eyebrow">Prüfungen</div><div class="big">'+r.total+'</div></div>'+
    '<div><div class="eyebrow">Bestanden</div><div class="big" style="color:var(--teal)">'+r.ok+'</div></div>'+
    '<div><div class="eyebrow">Fehlgeschlagen</div><div class="big" style="color:'+(r.fails?'var(--rose)':'var(--tx-3)')+'">'+r.fails+'</div></div>'+
    '<div style="margin-left:auto"><button class="btn ghost" data-act="runtests">Erneut prüfen</button></div></div>'+
    r.groups.map(function(g){
      return '<div class="t-grp"><h4>'+esc(g.name)+'<span>'+g.ok+' / '+(g.ok+g.fail)+'</span></h4>'+
        g.lines.map(l=>'<div class="t-line'+(l.pass?'':' f')+'"><span class="ic">'+(l.pass?'✓':'✕')+'</span><span>'+esc(l.txt)+'</span></div>').join('')+'</div>';
    }).join('')+'</div>';
}

/* =========================================================================
   11 · Start
   ========================================================================= */
async function init(){
  let loaded=null;
  try{ loaded=await Store.load(); }catch(e){}
  if(loaded&&loaded.__kodex==='locked'){
    gate(loaded,function(obj){ loaded=obj; boot(obj); });
    return;
  }
  boot(loaded);
}
function boot(loaded){
  if(loaded&&loaded.pages&&Object.keys(loaded.pages).length){
    S=loaded;
      S.settings=Object.assign({theme:'dark',docWidth:'normal',showRail:true,tint:'none',pattern:'none',font:'kodex',size:'m',autoLock:10},S.settings||{});
    if(S.settings.vault&&!VAULTKEY)S.settings.vault=false;
    const first=Object.values(S.pages).filter(p=>!p.trashed&&!p.hiddenRow&&!p.template)[0];
    route={view:'page',pageId:first?first.id:null,viewId:null};
    if(!first)route={view:'concept',pageId:null,viewId:null};
    $('#saveInfo').textContent='geladen · '+SAVE_MODE;
  }else{
    seed();
    route={view:'start',pageId:null,viewId:null};
    $('#saveInfo').textContent='neuer Arbeitsbereich';
    persist();
  }
  Object.values(S.pages).filter(p=>!p.parentId).forEach(p=>{ openNodes[p.id]=true; });
  ichLaden();
  /* Kleiner Zugang für Konsole, Erweiterungen und automatische Prüfungen */
  window.KODEX={
    get state(){ return S; }, get ich(){ return ICH; }, get peers(){ return PEERS; }, get sync(){ return SYNC; },
    seiten:function(){ return Object.values(S.pages).filter(function(p){return !p.trashed;}); },
    neueSeite:function(o){ return newPage(o||{}); },
    oeffne:function(id){ go('page',id); },
    raumBetreten:function(r,ws){ syncStart(r,ws); }, raumVerlassen:function(){ syncStop(); },
    schuetzen:function(p,pw){ return lockPage(p,pw); },
    zusammenfuehren:mergeStates,
    pruefen:runTests,
    speichern:function(){ return persistNow(); },
    version:'1.0'
  };
  applySettings(); bind(); render(); wacheStarten(); swAnmelden(); installBereit();
  if(S.settings.raum) syncStart(S.settings.raum,S.settings.wsUrl);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&SYNC){ Transport.senden({typ:'ruf'}); praesenzSenden(); } });
  const t=runTests();
  if(t.fails) console.warn('KODEX Selbsttest:',t.fails,'von',t.total,'fehlgeschlagen');
  else console.log('KODEX Selbsttest: '+t.total+' Prüfungen bestanden');
}
init();
})();
