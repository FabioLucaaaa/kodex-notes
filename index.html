  <div class="sec-lead"><span class="n">09</span><h2>Roadmap</h2></div>
  <div class="phase"><div class="pl">Phase 1<br>fertig</div><div><h4>Der Kern</h4><p>Block-Editor, Seitenbaum, Datenbanken mit fünf Ansichten, Filter, Sortierung, Gruppierung, Formeln, Suche, Kommandoleiste, Vorlagen, Papierkorb, Sicherung. Das ist der Stand in dieser Datei.</p></div></div>
  <div class="phase"><div class="pl">Phase 2<br>2–3 Wochen</div><div><h4>Alltagstauglichkeit</h4><p>Freie Automatisierungsregeln, Relationen mit Rollup-Aggregaten über mehrere Ebenen, wiederkehrende Aufgaben, Blockverweise (<code>((Block))</code>), Verlaufsansicht mit Wiederherstellungspunkten, Zeitschloss für geschützte Seiten (automatisches Verschließen nach Untätigkeit).</p></div></div>
  <div class="phase"><div class="pl">Phase 3<br>1 Monat</div><div><h4>Echte App</h4><p>Umbau auf IndexedDB für große Arbeitsbereiche, Dateianhänge lokal, PWA mit Offline-Installation, mobile Bedienung mit Wischgesten, Handschrift-freundliche Schnellnotiz.</p></div></div>
  <div class="phase"><div class="pl">Phase 4<br>optional</div><div><h4>Zwei Geräte</h4><p>Synchronisation über einen eigenen kleinen Server (Datei-Ablage plus Zeitstempel-Abgleich) oder über einen geteilten Ordner. Konfliktlösung: letzter Schreiber gewinnt, mit Konfliktkopie statt Datenverlust.</p></div></div>

  <div class="sec-lead"><span class="n">10</span><h2>Papier, Muster, Schrift</h2></div>
  <p>Eine App, in der man täglich Stunden verbringt, sollte nicht aussehen wie jede andere. Deshalb sind drei Ebenen der Darstellung frei einstellbar — und zwar so, dass sie sich nicht gegenseitig zerstören.</p>
  <h3>Papierton statt Farbthema</h3>
  <p>Zehn Pastelltöne, von Rosé über Salbei bis Taube. Der gewählte Ton wirkt in beiden Modi unterschiedlich: im hellen Modus <em>ist</em> er der Hintergrund, im dunklen Modus wird er nur zu wenigen Prozent über die Tinte gelegt und erzeugt einen kaum merklichen Schimmer. Technisch steckt dahinter genau eine Farbvariable, aus der alle übrigen Flächen abgeleitet werden:</p>
  <pre class="blueprint"><b>hell</b>    --bg: var(--paper-l)
        --surface: color-mix(in oklab, var(--paper-l) 30%, white)
        --line:    color-mix(in oklab, var(--paper-l) 68%, #8C8578)

<b>dunkel</b>  --bg: color-mix(in oklab, #0F0E15 93%, var(--paper-d))</pre>
  <p>Der Vorteil: ein neuer Ton kostet zwei Farbwerte, nicht ein ganzes Regelwerk. Kontraste bleiben automatisch erhalten, weil die Textfarben unabhängig davon definiert sind.</p>
  <h3>Muster im Hintergrund</h3>
  <p>Liniert, kariert, Punkte, Millimeterpapier und feines Karo — alles aus wiederholten Farbverläufen, keine Bilddateien. Das Muster liegt auf der Arbeitsfläche und scrollt mit dem Text mit (<code>background-attachment: local</code>), damit der Eindruck von echtem Papier entsteht statt einer feststehenden Tapete. Die Linienfarbe leitet sich aus der Textfarbe ab und passt sich damit jedem Papierton und beiden Modi von selbst an.</p>
  <h3>Schrift</h3>
  <p>Sieben Schriftbilder von Antiqua über Humanist und Rund bis Schreibmaschine, dazu vier Größen. Alle greifen ausschließlich auf Systemschriften zurück: keine Downloads, kein Netz, keine Wartezeit beim Öffnen. Überschriften und Bedienoberfläche werden getrennt gesteuert, damit auch die Schreibmaschinen-Variante bedienbar bleibt.</p>
  <div class="note">Die Kombination aus Papierton, Muster und Schrift ergibt über 1.600 Varianten. Praktisch heißt das: Du kannst jedem Bereich ein eigenes Gesicht geben — Schule liniert und in Antiqua, Code-Projekte glatt und technisch.</div>

  <h3>Bis auf den einzelnen Buchstaben</h3>
  <p>Die Schriftwahl in den Einstellungen gilt für den ganzen Arbeitsbereich. Markierst du dagegen Text — und sei es ein einziger Buchstabe —, erscheint die Werkzeugleiste über der Auswahl mit zwei zusätzlichen Feldern: <strong>Aa</strong> für die Schriftart und <strong>A±</strong> für die Größe. Damit lässt sich ein Wort in Schreibmaschine setzen, eine Zahl riesig machen oder ein einzelner Buchstabe in eine andere Schrift kippen.</p>
  <p>Technisch wird die Auswahl in ein schmales Stil-Element gewickelt, das nur die markierten Zeichen umfasst. Der Blocktyp bleibt davon unberührt, die Formatierung überlebt das Speichern, und ein Klick auf „zurücksetzen“ löst die Hüllen wieder auf, ohne den Text anzufassen.</p>
  <div class="note">Sparsam einsetzen: Wenn jeder zweite Buchstabe anders aussieht, liest niemand mehr den Inhalt. Für einzelne Hervorhebungen, Überschriften-Spielereien oder Notizzettel-Optik ist es genau richtig.</div>

  <div class="sec-lead"><span class="n">11</span><h2>Schutz mit Passwort</h2></div>
  <p>Zwei Stufen, beide mit echter Verschlüsselung im Browser — nicht mit einer ausgeblendeten Seite, die jeder über die Entwicklerkonsole wiederfindet.</p>
  <div class="card-grid">
    <div class="kcard"><span class="eyebrow">Stufe 1</span><h4>Einzelne Seite</h4><p>Inhalt und Datenbank der Seite werden verschlüsselt. Titel und Symbol bleiben sichtbar, damit die Struktur erhalten bleibt. Andere Seiten sind davon unberührt.</p></div>
    <div class="kcard"><span class="eyebrow">Stufe 2</span><h4>Ganzer Arbeitsbereich</h4><p>Der komplette Zustand wandert in einen verschlüsselten Block. Beim Öffnen erscheint zuerst ein Sperrbildschirm — ohne Passwort ist nicht einmal erkennbar, welche Seiten existieren.</p></div>
  </div>
  <h3>Wie es technisch funktioniert</h3>
  <pre class="blueprint">Passwort ──► <b>PBKDF2</b> (SHA-256, 150.000 Runden, zufälliger Salt)
                 │
                 ▼
            <b>AES-256-GCM</b> ──► { salt, iv, data }   ← das allein wird gespeichert

Klartext im Arbeitsspeicher · Schlüssel nie auf der Platte · IV bei jedem Speichern neu</pre>
  <ul>
    <li><strong>Kein gespeichertes Passwort.</strong> Aus dem Passwort wird bei jeder Eingabe erneut ein Schlüssel abgeleitet. In der Datei steht nur der Zufalls-Salt.</li>
    <li><strong>150.000 Runden</strong> machen das Durchprobieren teuer: Jeder Rateversuch kostet Rechenzeit, statt Millionen Versuche pro Sekunde zuzulassen.</li>
    <li><strong>GCM prüft mit.</strong> Ein manipulierter oder falsch entschlüsselter Block schlägt fehl, statt Datenmüll zu liefern — deshalb erkennt die App ein falsches Passwort zuverlässig.</li>
    <li><strong>Entsperrt heißt entsperrt bis zum Schließen.</strong> Der Schlüssel bleibt im Arbeitsspeicher, damit Tippen flüssig bleibt. Beim Speichern wird der Inhalt automatisch wieder verschlüsselt — der Klartext erreicht die Platte nie.</li>
  </ul>
  <h3>Was der Schutz nicht leistet</h3>
  <p>Ehrlichkeit gehört zum Konzept: Wer Zugriff auf dein entsperrtes Gerät hat, sieht alles. Ein Schadprogramm, das im Browser mitliest, ebenfalls. Und ein vergessenes Passwort bedeutet endgültigen Verlust — es gibt keine Hintertür, keine Wiederherstellungsfrage, keinen Zurücksetzen-Link. Genau das ist der Preis dafür, dass niemand sonst mitlesen kann.</p>
  <div class="note"><strong>Empfehlung:</strong> Ein längerer Satz schlägt ein kurzes kompliziertes Passwort. <code>DerHundVomNachbarnBellt7x</code> ist stärker und leichter zu merken als <code>Xz9!q</code>. Und lege dir eine unverschlüsselte Sicherung an einem sicheren Ort an, bevor du den ganzen Arbeitsbereich abschließt.</div>

  <div class="sec-lead"><span class="n">12</span><h2>Darstellung: Notiz oder Dokument</h2></div>
  <p>Jede Seite kann in zwei Ausprägungen erscheinen. <strong>Standard</strong> ist die normale Notizansicht — schnell, dicht, zum Runterschreiben. <strong>Dokument</strong> lässt dieselbe Seite aussehen wie genau dieses Konzeptpapier: großer Titel, breiterer Satzspiegel, erster Absatz als Vorspann, und jede Überschrift zweiter Ebene bekommt automatisch eine durchlaufende Abschnittsnummer mit Trennlinie darüber.</p>
  <h3>Warum das mehr ist als eine Schriftart</h3>
  <p>Der Unterschied liegt in der Absicht. Eine Notiz schreibst du für dich, ein Dokument für jemand anderen. Sobald etwas gelesen werden soll — Projektbrief, Serverkonzept, Angebot, Referat, Bewerbung — hilft Struktur, die man sieht, bevor man liest: Nummern zum Verweisen („schau dir Abschnitt 04 an“), Trennlinien als Atempausen, ein Vorspann, der die Kernaussage trägt.</p>
  <h3>Der Kniff dahinter</h3>
  <p>Die Nummerierung ist <em>kein Inhalt</em>, sondern Darstellung: Sie entsteht über einen CSS-Zähler. Du schreibst weiter ganz normale Überschriften. Verschiebst du einen Abschnitt, löschst einen oder fügst einen ein, stimmen die Nummern sofort — ohne dass du irgendwo nachzählen musst. Schaltest du zurück auf Standard, ist nichts verloren, weil nie etwas in deinen Text geschrieben wurde.</p>
  <p>Umschalten geht über das Seitenmenü („Darstellung: wie Konzept &amp; Doku“) oder über die Kommandoleiste, jederzeit und in beide Richtungen. Gedruckt wird die Dokumentansicht ebenfalls sauber — damit ist der Weg von der Notiz zum abgabefertigen PDF genau zwei Klicks lang.</p>
  <div class="note">Kombiniert wird es stark: Dokument-Darstellung auf Sand mit Antiqua-Schrift ergibt ein Papier, das man ausdrucken kann. Dieselbe Seite auf Flieder mit Punktraster ist wieder ein Notizzettel. Der Text bleibt derselbe.</div>

  <div class="sec-lead"><span class="n">13</span><h2>Zusammenarbeit</h2></div>
  <p>Mehrere Leute im selben Arbeitsbereich — das ist der Punkt, an dem eine Notiz-App entweder erwachsen wird oder Daten verliert. KODEX löst es in zwei Schichten, die unabhängig voneinander funktionieren.</p>

  <h3>Schicht 1: Zusammenführen</h3>
  <p>Der Kern ist keine Netzwerkfunktion, sondern eine Rechenfunktion: <code>zusammenführen(meinStand, deinStand)</code>. Sie nimmt zwei komplette Arbeitsbereiche und macht daraus einen — ohne dass jemand etwas verliert. Die Regeln:</p>
  <ul>
    <li><strong>Blöcke einzeln, nicht seitenweise.</strong> Wenn du oben schreibst und ich unten, behält die Zusammenführung beides. Nur wenn wir denselben Block anfassen, muss entschieden werden.</li>
    <li><strong>Jüngere Änderung gewinnt.</strong> Jeder Block trägt Zeitpunkt und Urheber. Bei exakt gleicher Zeit entscheidet die Kennung — deterministisch, damit alle Geräte zum selben Ergebnis kommen.</li>
    <li><strong>Neue Blöcke merken sich ihren Vorgänger</strong> und rutschen beim Zusammenführen wieder an die richtige Stelle, statt am Ende zu landen.</li>
    <li><strong>Vereinigung statt Auswahl</strong> bei Datenbankspalten und Ansichten: Niemandem verschwindet eine Spalte, nur weil der andere sie nicht kennt.</li>
    <li><strong>Zweimal zusammenführen ändert nichts.</strong> Die Funktion ist stabil und richtungsunabhängig — <code>A+B</code> ergibt dasselbe wie <code>B+A</code>. Beides wird im Selbsttest geprüft.</li>
  </ul>
  <p>Weil das reine Rechnerei ist, funktioniert es auch ganz ohne Verbindung: Zwei Leute exportieren ihren Stand als Datei, einer führt zusammen. Kein Server, kein Konto, trotzdem gemeinsame Arbeit.</p>

  <h3>Schicht 2: Live</h3>
  <p>Darüber liegt ein austauschbarer Übertragungsweg. Wer einen <strong>Raum</strong> betritt — einfach ein gemeinsamer Name — sendet geänderte Seiten gedrosselt an alle anderen im selben Raum und empfängt deren Änderungen. Angezeigt wird das als farbige Punkte in der Kopfzeile: wer da ist, und wer gerade auf derselben Seite arbeitet.</p>
  <p>Drei Wege stehen bereit, in dieser Reihenfolge:</p>
  <ol>
    <li><strong>BroadcastChannel</strong> — mehrere Fenster oder Tabs desselben Browsers. Braucht nichts weiter und funktioniert sofort.</li>
    <li><strong>Speicher-Ereignis</strong> — derselbe Zweck, falls der erste Weg fehlt.</li>
    <li><strong>WebSocket</strong> — für echte Zusammenarbeit über das Internet. Adresse eintragen, fertig.</li>
  </ol>
  <p>Der Block, in dem du gerade tippst, gehört dir: Eingehende Änderungen an genau diesem Block werden zurückgestellt, damit dir niemand den Satz unter dem Cursor wegzieht. Der Rest der Seite aktualisiert sich weiter, und die Schreibmarke bleibt, wo sie war.</p>

  <h3>Das Relais für echte Zusammenarbeit</h3>
  <p>Der Server muss nichts können außer weiterreichen — keine Datenbank, keine Anmeldung, kein Verständnis vom Inhalt. Diese knapp zwanzig Zeilen genügen:</p>
  <pre class="blueprint"><b>// relais.js — Node 18+, dann: node relais.js</b>
import { WebSocketServer } from 'ws';
const wss = new WebSocketServer({ port: 8080 });
const raeume = new Map();

wss.on('connection', (sock) =&gt; {
  let raum = null;
  sock.on('message', (roh) =&gt; {
    const msg = JSON.parse(roh);
    if (!raum) { raum = msg.raum; 
      if (!raeume.has(raum)) raeume.set(raum, new Set());
      raeume.get(raum).add(sock); }
    for (const s of raeume.get(raum))
      if (s !== sock &amp;&amp; s.readyState === 1) s.send(roh.toString());
  });
  sock.on('close', () =&gt; raeume.get(raum)?.delete(sock));
});</pre>
  <p>Auf einem kleinen Server oder einem Dienst mit kostenlosem Kontingent laufen lassen, Adresse als <code>wss://…</code> im Raum eintragen — damit arbeiten drei, vier Leute gleichzeitig in denselben Seiten.</p>

  <h3>Was geteilt wird und was nicht</h3>
  <ul>
    <li><strong>Geteilt:</strong> Seiten, Blöcke, Datenbanken, deren Spalten und Ansichten.</li>
    <li><strong>Privat:</strong> Papierton, Muster, Schrift, Erscheinungsbild — jeder sieht seinen eigenen Arbeitsbereich, wie er ihn mag.</li>
    <li><strong>Niemals übertragen:</strong> Seiten im Tresor. Verschlüsselte Inhalte verlassen das Gerät nicht, auch nicht als Chiffrat.</li>
  </ul>
  <div class="note"><strong>Ehrlich zu den Grenzen:</strong> Das hier ist Zusammenführung auf Blockebene, keine zeichengenaue Verschmelzung wie sie Online-Texteditoren in Echtzeit leisten. Wenn zwei Leute im selben Satz gleichzeitig tippen, gewinnt eine Fassung — beide gehen nicht ineinander auf. Für getrennte Absätze, Aufgabenlisten und Datenbanken, also den Normalfall bei zwei bis fünf Leuten, reicht das vollkommen. Ein Relais ohne Anmeldung ist außerdem nur so privat wie der Raumname geheim ist; wer echte Zugangskontrolle braucht, baut sie in das Relais ein.</div>

  <div class="sec-lead"><span class="n">14</span><h2>Bewusst weggelassen</h2></div>
  <p>Ein Werkzeug wird gut, indem es Dinge <em>nicht</em> tut. Auch mit Räumen fallen weg: Rechteverwaltung, Kommentar-Threads, Gästezugänge, Aktivitätsprotokoll, Bezahlpläne, Analytics. Das spart nicht nur Code — es spart Oberfläche, die dich jeden Tag Aufmerksamkeit kosten würde.</p>

  <div class="sec-lead"><span class="n">15</span><h2>Weiterbau</h2></div>
  <div class="card-grid">
    <div class="kcard"><span class="eyebrow">Sofort</span><h4>Als Datei behalten</h4><p>Herunterladen, mit Lesezeichen öffnen. Kein Aufbau nötig, funktioniert offline, lässt sich in jedem Editor anpassen.</p></div>
    <div class="kcard"><span class="eyebrow">Nächster Schritt</span><h4>Als PWA</h4><p>Manifest plus Service Worker ergänzen, dann installierbar auf Handy und Rechner mit eigenem Symbol.</p></div>
    <div class="kcard"><span class="eyebrow">Größer</span><h4>Als Desktop-App</h4><p>Tauri statt Electron: kleiner, schneller, und du bekommst echten Dateizugriff für Anhänge und automatische Sicherungen.</p></div>
    <div class="kcard"><span class="eyebrow">Ausbau</span><h4>Als Web-App</h4><p>Wenn Synchronisation dazukommt: dieselbe Datenstruktur, aber in einer Datenbank statt im Browser-Speicher.</p></div>
  </div>

/* ---- 4.1 Formel-Sprache ------------------------------------------------ */
function tokenize(src){
  const t=[]; let i=0; const s=String(src);
  const isD=c=>c>='0'&&c<='9', isI=c=>/[A-Za-zÄÖÜäöüß_]/.test(c);
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\n'||c==='\t'){i++;continue;}
    if(isD(c)||(c==='.'&&isD(s[i+1]))){let j=i;while(j<s.length&&(isD(s[j])||s[j]==='.'))j++;t.push({k:'num',v:parseFloat(s.slice(i,j))});i=j;continue;}
    if(c==='"'||c==="'"){const q=c;let j=i+1,out='';while(j<s.length&&s[j]!==q){if(s[j]==='\\'){out+=s[j+1];j+=2;}else{out+=s[j];j++;}}t.push({k:'str',v:out});i=j+1;continue;}
    if(isI(c)){let j=i;while(j<s.length&&(isI(s[j])||isD(s[j])))j++;t.push({k:'id',v:s.slice(i,j)});i=j;continue;}
    const two=s.slice(i,i+2);
    if(['==','!=','>=','<='].indexOf(two)>=0){t.push({k:'op',v:two});i+=2;continue;}
    if('+-*/%<>(),'.indexOf(c)>=0){t.push({k:c==='('||c===')'||c===','?c:'op',v:c});i++;continue;}
    if(c==='='){t.push({k:'op',v:'=='});i++;continue;}
    throw new Error('Unbekanntes Zeichen: '+c);
  }
  t.push({k:'end'}); return t;
}
function parseFormula(src){
  const t=tokenize(src); let p=0;
  const peek=()=>t[p], next=()=>t[p++];
  function expect(k,v){const tk=next();if(tk.k!==k||(v!=null&&tk.v!==v))throw new Error('Erwartet '+(v||k));return tk;}
  function primary(){
    const tk=peek();
    if(tk.k==='num'){next();return{n:'num',v:tk.v};}
    if(tk.k==='str'){next();return{n:'str',v:tk.v};}
    if(tk.k==='('){next();const e=expr();expect(')');return e;}
    if(tk.k==='op'&&(tk.v==='-')){next();return{n:'neg',a:unary()};}
    if(tk.k==='id'){
      next();
      const low=tk.v.toLowerCase();
      if(low==='true'||low==='wahr')return{n:'bool',v:true};
      if(low==='false'||low==='falsch')return{n:'bool',v:false};
      if(low==='not'||low==='nicht')return{n:'not',a:unary()};
      if(peek().k==='('){ next(); const args=[];
        if(peek().k!==')'){ args.push(expr()); while(peek().k===','){next();args.push(expr());} }
        expect(')'); return{n:'call',f:low,args:args};
      }
      return{n:'ref',v:tk.v};
    }
    throw new Error('Unerwartetes Zeichen');
  }
  function unary(){ const tk=peek(); if(tk.k==='op'&&tk.v==='-'){next();return{n:'neg',a:unary()};} return primary(); }
  function mul(){ let l=unary(); while(peek().k==='op'&&'*/%'.indexOf(peek().v)>=0){const o=next().v;l={n:'bin',o:o,l:l,r:unary()};} return l; }
  function add(){ let l=mul(); while(peek().k==='op'&&(peek().v==='+'||peek().v==='-')){const o=next().v;l={n:'bin',o:o,l:l,r:mul()};} return l; }
  function cmp(){ let l=add(); while(peek().k==='op'&&['==','!=','>','<','>=','<='].indexOf(peek().v)>=0){const o=next().v;l={n:'bin',o:o,l:l,r:add()};} return l; }
  function and(){ let l=cmp(); while(peek().k==='id'&&/^(and|und)$/i.test(peek().v)){next();l={n:'and',l:l,r:cmp()};} return l; }
  function expr(){ let l=and(); while(peek().k==='id'&&/^(or|oder)$/i.test(peek().v)){next();l={n:'or',l:l,r:and()};} return l; }
  const out=expr(); if(peek().k!=='end')throw new Error('Rest nach Formelende'); return out;
}
function num(v){ if(typeof v==='number')return v; if(v===true)return 1; if(!v)return 0; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
function truthy(v){ return !(v===false||v==null||v===''||v===0||(Array.isArray(v)&&!v.length)); }
function evalNode(a,ctx){
  switch(a.n){
    case 'num': case 'str': case 'bool': return a.v;
    case 'ref': return ctx.get(a.v);
    case 'neg': return -num(evalNode(a.a,ctx));
    case 'not': return !truthy(evalNode(a.a,ctx));
    case 'and': return truthy(evalNode(a.l,ctx))&&truthy(evalNode(a.r,ctx));
    case 'or':  return truthy(evalNode(a.l,ctx))||truthy(evalNode(a.r,ctx));
    case 'bin':{
      const L=evalNode(a.l,ctx), R=evalNode(a.r,ctx);
      switch(a.o){
        case '+': return (typeof L==='string'||typeof R==='string')?String(L==null?'':L)+String(R==null?'':R):num(L)+num(R);
        case '-': return num(L)-num(R);
        case '*': return num(L)*num(R);
        case '/': return num(R)===0?0:num(L)/num(R);
        case '%': return num(R)===0?0:num(L)%num(R);
        case '==': return (typeof L==='string'||typeof R==='string')?String(L)===String(R):L===R;
        case '!=': return (typeof L==='string'||typeof R==='string')?String(L)!==String(R):L!==R;
        case '>': return num(L)>num(R); case '<': return num(L)<num(R);
        case '>=': return num(L)>=num(R); case '<=': return num(L)<=num(R);
      }
      throw new Error('Operator?');
    }
    case 'call':{
      const A=a.args.map(x=>evalNode(x,ctx));
      switch(a.f){
        case 'prop': return ctx.get(String(A[0]));
        case 'if': return truthy(A[0])?A[1]:A[2];
        case 'round': return A.length>1?Math.round(num(A[0])*Math.pow(10,num(A[1])))/Math.pow(10,num(A[1])):Math.round(num(A[0]));
        case 'floor': return Math.floor(num(A[0]));
        case 'ceil': return Math.ceil(num(A[0]));
        case 'abs': return Math.abs(num(A[0]));
        case 'min': return Math.min.apply(null,A.map(num));
        case 'max': return Math.max.apply(null,A.map(num));
        case 'length': return Array.isArray(A[0])?A[0].length:String(A[0]==null?'':A[0]).length;
        case 'concat': return A.map(x=>x==null?'':String(x)).join('');
        case 'upper': return String(A[0]==null?'':A[0]).toUpperCase();
        case 'lower': return String(A[0]==null?'':A[0]).toLowerCase();
        case 'contains': return String(A[0]==null?'':A[0]).toLowerCase().indexOf(String(A[1]==null?'':A[1]).toLowerCase())>=0;
        case 'empty': return !truthy(A[0]);
        case 'number': return num(A[0]);
        case 'now': return iso(new Date());
        case 'datediff': return (A[0]&&A[1])?daysBetween(String(A[0]),String(A[1])):0;
      }
      throw new Error('Unbekannte Funktion: '+a.f);
    }
  }
  throw new Error('Knoten?');
}
function evalFormula(src,ctx){
  try{ return evalNode(parseFormula(src),ctx); }
  catch(e){ return {err:e.message}; }
}
function rowCtx(db,row){
  return{ get:function(name){
    const pr=db.props.filter(p=>p.name===name)[0];
    if(!pr)return '';
    return cellValue(db,row,pr);
  }};
}
function cellValue(db,row,pr){
  if(pr.type==='formula'){ const r=evalFormula(pr.formula||'""',rowCtx(db,row)); return (r&&r.err)?'':r; }
  if(pr.type==='created') return iso(new Date(row.createdAt||Date.now()));
  const v=row.values?row.values[pr.id]:undefined;
  if(v===undefined) return pr.type==='multi'?[]:(pr.type==='checkbox'?false:'');
  return v;
}

/* ---- 4.2 Filter · Sortierung · Gruppierung ----------------------------- */
const OPS=[
  {v:'is',t:'ist'},{v:'isnot',t:'ist nicht'},{v:'contains',t:'enthält'},{v:'ncontains',t:'enthält nicht'},
  {v:'empty',t:'ist leer'},{v:'nempty',t:'ist nicht leer'},{v:'gt',t:'größer als'},{v:'lt',t:'kleiner als'},
  {v:'before',t:'vor dem'},{v:'after',t:'nach dem'},{v:'checked',t:'ist angehakt'},{v:'unchecked',t:'ist nicht angehakt'}
];
function matchFilter(db,row,f){
  const pr=db.props.filter(p=>p.id===f.prop)[0]; if(!pr)return true;
  let v=cellValue(db,row,pr);
  const sv=Array.isArray(v)?v.join(' '):String(v==null?'':v);
  const q=String(f.val==null?'':f.val);
  switch(f.op){
    case 'is': return Array.isArray(v)?v.indexOf(q)>=0:sv.toLowerCase()===q.toLowerCase();
    case 'isnot': return Array.isArray(v)?v.indexOf(q)<0:sv.toLowerCase()!==q.toLowerCase();
    case 'contains': return sv.toLowerCase().indexOf(q.toLowerCase())>=0;
    case 'ncontains': return sv.toLowerCase().indexOf(q.toLowerCase())<0;
    case 'empty': return !truthy(v);
    case 'nempty': return truthy(v);
    case 'gt': return num(v)>num(q);
    case 'lt': return num(v)<num(q);
    case 'before': return !!sv&&sv<q;
    case 'after': return !!sv&&sv>q;
    case 'checked': return v===true;
    case 'unchecked': return v!==true;
  }
  return true;
}
function applyFilters(db,rows,filters){
  if(!filters||!filters.length)return rows.slice();
  return rows.filter(r=>filters.every(f=>matchFilter(db,r,f)));
}
function sortValue(db,row,pr){
  const v=cellValue(db,row,pr);
  if(pr.type==='select'||pr.type==='status'){
    const i=(pr.options||[]).map(o=>o.v).indexOf(v); return i<0?999:i;
  }
  if(pr.type==='number'||pr.type==='formula')return num(v);
  if(pr.type==='checkbox')return v?1:0;
  return String(Array.isArray(v)?v.join(','):(v==null?'':v)).toLowerCase();
}
function sortRows(db,rows,sorts){
  if(!sorts||!sorts.length)return rows.slice();
  const out=rows.slice();
  out.sort(function(a,b){
    for(let i=0;i<sorts.length;i++){
      const s=sorts[i], pr=db.props.filter(p=>p.id===s.prop)[0]; if(!pr)continue;
      let A=sortValue(db,a,pr), B=sortValue(db,b,pr);
      const ae=(A===''||A===999), be=(B===''||B===999);
      if(ae!==be) return ae?1:-1;              // Leeres immer ans Ende
      if(A<B)return s.dir==='desc'?1:-1;
      if(A>B)return s.dir==='desc'?-1:1;
    }
    return 0;
  });
  return out;
}
function groupRows(db,rows,propId){
  const pr=db.props.filter(p=>p.id===propId)[0];
  if(!pr)return[{key:'',label:'Alle',color:'grey',rows:rows.slice()}];
  const groups=[], index={};
  const opts=(pr.options||[]).slice();
  opts.forEach(function(o){ const g={key:o.v,label:o.v,color:o.c||'grey',rows:[]}; index[o.v]=g; groups.push(g); });
  const none={key:'',label:'Ohne '+pr.name,color:'grey',rows:[]};
  rows.forEach(function(r){
    let v=cellValue(db,r,pr);
    if(Array.isArray(v))v=v[0];
    const k=(v==null||v==='')?null:String(v);
    if(k==null){none.rows.push(r);return;}
    if(!index[k]){const g={key:k,label:k,color:'grey',rows:[]};index[k]=g;groups.push(g);}
    index[k].rows.push(r);
  });
  groups.push(none);
  return groups;
}
function viewRows(db,view){
  return sortRows(db,applyFilters(db,db.rows,view.filters),view.sorts);
}

/* ---- 4.3 Markdown-Kürzel und Export ------------------------------------ */
const MD=[
  [/^#\s$/,'h1'],[/^##\s$/,'h2'],[/^###\s$/,'h3'],
  [/^[-*+]\s$/,'bullet'],[/^1\.\s$/,'num'],[/^\[\]\s$/,'todo'],[/^\[\s?\]\s$/,'todo'],
  [/^>\s$/,'quote'],[/^```$/,'code'],[/^---$/,'divider'],[/^\|\s$/,'callout'],[/^>>\s$/,'toggle']
];
function mdShortcut(raw){
  const t=strip(raw);
  for(let i=0;i<MD.length;i++){ if(MD[i][0].test(t)) return MD[i][1]; }
  return null;
}
const MDPRE={h1:'# ',h2:'## ',h3:'### ',bullet:'- ',num:'1. ',quote:'> ',todo:'- [ ] '};
function blocksToMarkdown(blocks){
  const out=[];
  (blocks||[]).forEach(function(b){
    const pad='  '.repeat(b.indent||0);
    const txt=strip(b.text).trim();
    switch(b.type){
      case 'divider': out.push('---');break;
      case 'code': out.push('```'+(b.lang||'')+'\n'+strip(b.text)+'\n```');break;
      case 'todo': out.push(pad+'- ['+(b.checked?'x':' ')+'] '+txt);break;
      case 'callout': out.push('> '+(b.icon||'💡')+' '+txt);break;
      case 'toggle': out.push(pad+'- '+txt);break;
      case 'image': out.push('!['+txt+']('+(b.url||'')+')');break;
      case 'bookmark': out.push('['+(txt||b.url)+']('+(b.url||'')+')');break;
      default: out.push(pad+(MDPRE[b.type]||'')+txt);
    }
  });
  return out.join('\n\n').replace(/\n{3,}/g,'\n\n');
}
function pageToMarkdown(p){
  let md='# '+titleOf(p)+'\n\n';
  if(p.locked&&!p.unlocked) return md+'_Diese Seite ist verschlüsselt._\n';
  if(p.type==='db'&&p.db){
    const db=p.db, v=db.views[0], rows=viewRows(db,v);
    const cols=db.props.filter(pr=>(v.hidden||[]).indexOf(pr.id)<0);
    md+='| '+cols.map(c=>c.name).join(' | ')+' |\n|'+cols.map(()=>'---').join('|')+'|\n';
    rows.forEach(function(r){
      md+='| '+cols.map(function(c){const val=cellValue(db,r,c);return Array.isArray(val)?val.join(', '):(val===true?'x':(val===false?'':String(val==null?'':val)));}).join(' | ')+' |\n';
    });
    return md;
  }
  return md+blocksToMarkdown(p.blocks);
}

/* ---- 4.4 Suche und Rückverweise ---------------------------------------- */
function searchAll(q){
  const s=String(q||'').trim().toLowerCase(); if(!s)return[];
  const res=[];
  Object.values(S.pages).forEach(function(p){
    if(p.trashed)return;
    if(p.locked&&!p.unlocked){                       /* gesperrte Inhalte bleiben außerhalb der Suche */
      if(titleOf(p).toLowerCase().indexOf(s)>=0)res.push({page:p,score:60,snip:'🔒 gesperrt'});
      return;
    }
    const t=titleOf(p).toLowerCase();
    let score=0, snip='';
    if(t.indexOf(s)>=0) score+= (t.indexOf(s)===0?120:80);
    if(p.type==='doc'&&p.blocks){
      for(let i=0;i<p.blocks.length;i++){
        const bt=strip(p.blocks[i].text);
        const k=bt.toLowerCase().indexOf(s);
        if(k>=0){ score+=25; if(!snip){ const st=Math.max(0,k-30); snip=(st>0?'…':'')+bt.slice(st,st+90); } break; }
      }
    }
    if(p.type==='db'&&p.db){
      for(let i=0;i<p.db.rows.length;i++){
        const r=p.db.rows[i];
        const flat=p.db.props.map(pr=>{const v=cellValue(p.db,r,pr);return Array.isArray(v)?v.join(' '):String(v==null?'':v);}).join(' ');
        if(flat.toLowerCase().indexOf(s)>=0){ score+=20; if(!snip)snip=flat.slice(0,90); break; }
      }
    }
    if(score>0)res.push({page:p,score:score,snip:snip||(p.type==='db'?'Datenbank · '+p.db.rows.length+' Einträge':'Seite')});
  });
  return res.sort((a,b)=>b.score-a.score).slice(0,40);
}
function backlinksTo(p){
  const name=titleOf(p).toLowerCase(); const out=[];
  Object.values(S.pages).forEach(function(o){
    if(o.trashed||o.id===p.id||o.type!=='doc'||(o.locked&&!o.unlocked))return;
    (o.blocks||[]).forEach(function(b){
      const t=strip(b.text);
      if(t.toLowerCase().indexOf('[['+name+']]')>=0) out.push({page:o,snip:t.slice(0,80)});
    });

}
function stats(p){
  if(p.type==='db')return{a:p.db.rows.length+' Einträge',b:p.db.props.length+' Spalten',c:p.db.views.length+' Ansichten'};

}

/* =========================================================================
   4b · Zusammenführen — der Kern jeder Zusammenarbeit
   Reine Funktionen: zwei Stände rein, ein Stand raus. Kein DOM, kein Netz.
   ========================================================================= */

/* Jede Änderung bekommt Herkunft und Zeit. Wer zuletzt geschrieben hat, gewinnt;
   bei exakt gleicher Zeit entscheidet die Kennung — damit alle Geräte dasselbe Ergebnis bekommen. */
function neuer(a,b){
  const ra=(a&&a.rev)||0, rb=(b&&b.rev)||0;
  if(ra!==rb)return ra>rb?a:b;
  const ta=(a&&a.updatedAt)||0, tb=(b&&b.updatedAt)||0;
  if(ta!==tb)return ta>tb?a:b;
  return String((a&&a.by)||'')>=String((b&&b.by)||'')?a:b;
}
function neuerBlock(a,b){
  const ta=(a&&a.at)||0, tb=(b&&b.at)||0;
  if(ta!==tb)return ta>tb?a:b;
  return String((a&&a.by)||'')>=String((b&&b.by)||'')?a:b;
}
/* Blocklisten verschmelzen: Inhalte einzeln, Reihenfolge von der jüngeren Seite,
   fremde neue Blöcke landen hinter ihrem gemerkten Vorgänger. */
function mergeBlocks(hier,dort,fuehrend){
  const A=hier||[], B=dort||[];
  const idxA={}, idxB={};
  A.forEach(function(b){ idxA[b.id]=b; });
  B.forEach(function(b){ idxB[b.id]=b; });
  const basis=(fuehrend==='dort')?B:A, andere=(fuehrend==='dort')?A:B;
  const idxBasis=(fuehrend==='dort')?idxB:idxA;
  const out=basis.map(function(b){
    const g=(fuehrend==='dort')?idxA[b.id]:idxB[b.id];
    return g?JSON.parse(JSON.stringify(neuerBlock(b,g))):JSON.parse(JSON.stringify(b));
  });
  /* Blöcke, die nur die andere Seite kennt */
  const fehlend=andere.filter(function(b){ return !idxBasis[b.id]; });
  fehlend.forEach(function(b){
    const pos=b.after?out.findIndex(function(x){ return x.id===b.after; }):-1;
    if(pos>=0)out.splice(pos+1,0,JSON.parse(JSON.stringify(b)));
    else out.push(JSON.parse(JSON.stringify(b)));
  });
  return out;
}
function mergeRows(hier,dort){
  const A=hier||[], B=dort||[], idx={}, out=[];
  A.forEach(function(r){ idx[r.id]=JSON.parse(JSON.stringify(r)); out.push(idx[r.id]); });
  B.forEach(function(r){
    if(!idx[r.id]){ out.push(JSON.parse(JSON.stringify(r))); return; }
    const g=neuerBlock(idx[r.id],r);
    if(g!==idx[r.id])Object.assign(idx[r.id],JSON.parse(JSON.stringify(r)));
  });
  return out;
}
function mergePage(a,b,stat){
  const gewinner=neuer(a,b), verlierer=(gewinner===a)?b:a;
  const out=JSON.parse(JSON.stringify(gewinner));
  /* Papierkorb ist eine Änderung wie jede andere: der jüngere Stand entscheidet */
  if(a.blocks&&b.blocks){
    out.blocks=mergeBlocks(a.blocks,b.blocks,(gewinner===b)?'dort':'hier');
    if(stat){
      const beide=Math.min(a.blocks.length,b.blocks.length);
      a.blocks.forEach(function(x){
        const y=b.blocks.filter(function(z){return z.id===x.id;})[0];
        if(y&&strip(x.text)!==strip(y.text)&&Math.abs(((x.at)||0)-((y.at)||0))<60000)stat.konflikte++;
      });
    }
  }
  if(a.db&&b.db){
    out.db=JSON.parse(JSON.stringify((gewinner===a?a:b).db));
    out.db.rows=mergeRows(a.db.rows,b.db.rows);
    /* Spalten und Ansichten: Vereinigung nach Kennung, damit niemandem eine Spalte verschwindet */
    const spalten={}; (a.db.props||[]).concat(b.db.props||[]).forEach(function(p){ if(!spalten[p.id])spalten[p.id]=p; });
    out.db.props=Object.keys(spalten).map(function(k){ return JSON.parse(JSON.stringify(spalten[k])); });
    const sichten={}; (a.db.views||[]).concat(b.db.views||[]).forEach(function(v){ if(!sichten[v.id])sichten[v.id]=v; });
    out.db.views=Object.keys(sichten).map(function(k){ return JSON.parse(JSON.stringify(sichten[k])); });
  }
  return out;
}
/* Zwei komplette Arbeitsbereiche zusammenführen. Einstellungen bleiben immer lokal. */
function mergeStates(lokal,fremd){
  const stat={neu:0,aktualisiert:0,unveraendert:0,konflikte:0};
  const out={version:lokal.version||1,settings:lokal.settings,pages:{}};
  const ids={};
  Object.keys(lokal.pages||{}).forEach(function(id){ ids[id]=1; });
  Object.keys(fremd.pages||{}).forEach(function(id){ ids[id]=1; });
  Object.keys(ids).forEach(function(id){
    const a=lokal.pages[id], b=fremd.pages[id];
    if(a&&!b){ out.pages[id]=a; stat.unveraendert++; return; }
    if(!a&&b){ out.pages[id]=JSON.parse(JSON.stringify(b)); stat.neu++; return; }
    const zusammen=mergePage(a,b,stat);
    out.pages[id]=zusammen;
    if(JSON.stringify(zusammen)===JSON.stringify(a))stat.unveraendert++; else stat.aktualisiert++;
  });
  return{state:out,stat:stat};
}

/* ---- Cursor-Werkzeuge --------------------------------------------------- */
function caretOffset(el){
  const sel=window.getSelection(); if(!sel||!sel.rangeCount)return 0;
  const rg=sel.getRangeAt(0);
  if(!el.contains(rg.endContainer))return 0;
  const r=rg.cloneRange(); r.selectNodeContents(el); r.setEnd(rg.endContainer,rg.endOffset);
  return r.toString().length;
}
function posToPoint(el,pos){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null); let n,acc=0,last=null;
  while((n=w.nextNode())){ const len=n.nodeValue.length; last=n;
    if(acc+len>=pos)return{node:n,off:clamp(pos-acc,0,len)}; acc+=len; }
  return last?{node:last,off:last.nodeValue.length}:{node:el,off:0};
}
function setCaret(el,pos){
  if(!el)return; el.focus({preventScroll:true});
  const total=el.textContent.length;
  if(pos==='end')pos=total; if(pos==='start'||pos==null)pos=0;
  pos=clamp(pos,0,total);
  const p=posToPoint(el,pos), r=document.createRange();
  try{ r.setStart(p.node,p.off); }catch(e){ r.selectNodeContents(el); r.collapse(false); }
  r.collapse(true);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function atStart(el){ return caretOffset(el)===0; }
function atEnd(el){ return caretOffset(el)>=el.textContent.length; }

function visibleBlocks(list){

    out.push(b);
    if(b.type==='toggle'&&b.collapsed) hideUntil=(b.indent||0);
  }
  return out;
}

function syncBlock(el){

function insertBlock(afterId,type,text,extra){

/* ---- Enter und Backspace: von Tastatur UND von der Handy-Tastatur nutzbar --- */
function doEnter(el){
  const id=el.dataset.id, b=bById(id); if(!b)return;
  const list=blocksOf(), i=bIndex(id);
  syncBlock(el);
  const off=caretOffset(el), full=el.textContent;
  if(!full.trim()&&(b.type==='bullet'||b.type==='num'||b.type==='todo'||b.type==='quote')&&!b.indent){
    b.type='p'; touch(curPage()); ED.focus=id; ED.caret=0; renderBlocks(); return; }
  if(!full.trim()&&b.indent){ b.indent=Math.max(0,b.indent-1); touch(curPage()); ED.focus=id; ED.caret=0; renderBlocks(); return; }
  const tail=off<full.length?full.slice(off):'';
  if(tail){ b.text=esc(full.slice(0,off)); }
  const keep=['bullet','num','todo'].indexOf(b.type)>=0?b.type:'p';
  const nb=blk(keep,esc(tail),{indent:b.indent||0});
  nb.at=Date.now(); nb.after=b.id; if(typeof ICH!=='undefined'&&ICH)nb.by=ICH.id;
  list.splice(i+1,0,nb); touch(curPage()); ED.focus=nb.id; ED.caret=0; renderBlocks();
}
function doBackspaceStart(el){
  const id=el.dataset.id, b=bById(id); if(!b)return false;
  const list=blocksOf(), i=bIndex(id);
  if(b.type!=='p'&&b.type!=='code'){ syncBlock(el); b.type='p'; touch(curPage()); ED.focus=id; ED.caret=0; renderBlocks(); return true; }
  if(b.indent){ b.indent--; touch(curPage()); ED.focus=id; ED.caret=0; renderBlocks(); return true; }
  const prev=list[i-1];
  if(prev&&i>0){ syncBlock(el);
    const plen=strip(prev.text).length;
    if(prev.type==='divider'){ list.splice(i-1,1); }
    else{ prev.text=(prev.text||'')+(b.text||''); list.splice(i,1); }
    touch(curPage()); ED.focus=prev.type==='divider'?id:prev.id; ED.caret=prev.type==='divider'?0:plen; renderBlocks(); return true; }
  return false;
}

/* ---- Tastatur im Editor ------------------------------------------------- */
function onEditorKey(e){
  const el=e.target.closest('.blk'); if(!el)return;
  const id=el.dataset.id, b=bById(id); if(!b)return;
  const list=blocksOf(), i=bIndex(id), mod=e.ctrlKey||e.metaKey;

  if(mod&&e.shiftKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); moveBlock(id,e.key==='ArrowUp'?-1:1); return; }
  if(mod&&e.key.toLowerCase()==='d'){ e.preventDefault(); syncBlock(el);
    const copy=Object.assign({},b,{id:uid('b')}); list.splice(i+1,0,copy); touch(curPage()); ED.focus=copy.id; ED.caret='end'; renderBlocks(); return; }
  if(mod&&e.key==='Backspace'){ e.preventDefault(); const prev=list[i-1]; removeBlock(id); ED.focus=prev?prev.id:blocksOf()[0].id; ED.caret='end'; renderBlocks(); return; }
  if(mod&&['b','i','e','k'].indexOf(e.key.toLowerCase())>=0&&!e.shiftKey){
    const k=e.key.toLowerCase();
    if(k==='k'&&!window.getSelection().toString())return;      // Strg+K bleibt Kommandoleiste
    e.preventDefault(); applyFmt(k==='b'?'bold':k==='i'?'italic':k==='e'?'code':'link'); return;
  }

  if(e.key==='Enter'&&!e.shiftKey){
    if(b.type==='code')return;                                  // Code: Zeilenumbruch erlaubt
    e.preventDefault(); doEnter(el); return;
  }
  if(e.key==='Tab'){
    e.preventDefault(); syncBlock(el);
    if(b.type==='code'){ document.execCommand('insertText',false,'  '); return; }
    b.indent=clamp((b.indent||0)+(e.shiftKey?-1:1),0,3); touch(curPage());
    ED.focus=id; ED.caret=caretOffset(el); renderBlocks(); return;
  }
  if(e.key==='Backspace'&&atStart(el)&&!window.getSelection().toString()){
    if(doBackspaceStart(el)){ e.preventDefault(); return; }
  }
  if(e.key==='ArrowUp'&&!e.shiftKey){
    const off=caretOffset(el);
    if(off===0||el.textContent.slice(0,off).indexOf('\n')<0){
      const prev=$$('.blk',$('#blocks')); const k=prev.indexOf(el);
      if(k>0){ e.preventDefault(); setCaret(prev[k-1],'end'); } }
    return;
  }
  if(e.key==='ArrowDown'&&!e.shiftKey){
    const off=caretOffset(el);
    if(off>=el.textContent.length||el.textContent.slice(off).indexOf('\n')<0){
      const all=$$('.blk',$('#blocks')); const k=all.indexOf(el);
      if(k>=0&&k<all.length-1){ e.preventDefault(); setCaret(all[k+1],0); } }
    return;
  }
  if(e.key==='Escape'){ closePop(); ED.slash=null; ED.link=null; }
}
function onEditorInput(e){
  const el=e.target.closest('.blk'); if(!el)return;
  const b=bById(el.dataset.id); if(!b)return;
  const raw=el.textContent;

  /* Markdown-Kürzel */
  if(b.type!=='code'){
    const md=mdShortcut(raw);
    if(md){ b.text=''; b.type=md; if(md==='code')b.lang='javascript'; if(md==='callout')b.icon='💡';
      if(md==='divider'){ b.text=''; touch(curPage()); const nb=insertBlock(b.id,'p',''); ED.focus=nb.id; ED.caret=0; renderBlocks(); return; }
      touch(curPage()); ED.focus=b.id; ED.caret=0; renderBlocks(); return; }
  }
  syncBlock(el);

  /* Blockwähler und Seitenverknüpfung */
  const off=caretOffset(el), before=raw.slice(0,off);
  if(!ED.slash&&!ED.link&&/\/$/.test(before)&&(off===1||/[\s\u00A0]$/.test(before.slice(-2,-1)))){
    ED.slash={id:b.id,start:off-1}; openSlash(el,'');
  }else if(ED.slash&&ED.slash.id===b.id){
    if(off<=ED.slash.start){ ED.slash=null; closePop(); }
    else openSlash(el,before.slice(ED.slash.start+1));
  }
  if(!ED.link&&!ED.slash&&/\[\[$/.test(before)){ ED.link={id:b.id,start:off-2}; openLinkPicker(el,''); }
  else if(ED.link&&ED.link.id===b.id){
    if(off<=ED.link.start){ ED.link=null; closePop(); }
    else openLinkPicker(el,before.slice(ED.link.start+2));
  }
}
function replaceRange(el,from,to,text){
  const a=posToPoint(el,from), z=posToPoint(el,to), r=document.createRange();
  r.setStart(a.node,a.off); r.setEnd(z.node,z.off); r.deleteContents();
  if(text){ const n=document.createTextNode(text); r.insertNode(n); }
  const b=bById(el.dataset.id); if(b){ b.text=undecorate(el.innerHTML); touch(curPage()); }
}

function openLinkPicker(el,q){

function showPop(anchor,label){

    return '<button class="pop-item'+(k===0?' sel':'')+'" data-k="'+k+'"><span class="ico">'+esc(it.ico||'•')+'</span><span><b style="font-weight:500">'+esc(it.label)+'</b><br><span style="font-size:11px;color:var(--tx-3)">'+esc(it.sub||'')+'</span></span></button>';
  }).join('');
  pop.classList.add('on');
  if(TOUCH){ popAlsBlatt(pop); return; }

  const sel=window.getSelection(); let r=null;
  try{ r=sel.rangeCount?sel.getRangeAt(0).getBoundingClientRect():null; }catch(e){}
  const base=(r&&r.top)?r:anchor.getBoundingClientRect();
  const h=Math.min(pop.scrollHeight,window.innerHeight*0.5);
  const top=(base.bottom+h+12>window.innerHeight)?base.top-h-8:base.bottom+6;
  pop.style.top=Math.max(8,top)+'px';
  pop.style.left=Math.min(base.left,window.innerWidth-pop.offsetWidth-12)+'px';

function popNav(e){
  if(!popItems.length||!$('#pop').classList.contains('on'))return false;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
    popSel=(popSel+(e.key==='ArrowDown'?1:-1)+popItems.length)%popItems.length;
    $$('#pop .pop-item').forEach((b,i)=>b.classList.toggle('sel',i===popSel));
    const sel=$('#pop .pop-item.sel'); if(sel)sel.scrollIntoView({block:'nearest'}); return true; }
  if(e.key==='Enter'){ e.preventDefault(); const it=popItems[popSel]; if(it)it.run(); return true; }
  if(e.key==='Escape'){ e.preventDefault(); closePop(); ED.slash=null; ED.link=null; return true; }

/* ---- Auswahl-Werkzeugleiste --------------------------------------------- */
function saveSel(){ const s=window.getSelection(); return (s&&s.rangeCount)?s.getRangeAt(0).cloneRange():null; }
function restoreSel(r){ if(!r)return; const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }
/* Auswahl in ein Stil-Element wickeln — wirkt bis auf einzelne Buchstaben genau */
function wrapSelection(css){
  const sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed)return null;
  const r=sel.getRangeAt(0);
  const host=(r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement);
  const blk=host&&host.closest?host.closest('.blk'):null; if(!blk)return null;
  const span=document.createElement('span');
  span.className='ff'; span.setAttribute('style',css);
  try{ span.appendChild(r.extractContents()); r.insertNode(span); }catch(e){ return null; }
  /* leere Hüllen aufräumen und Auswahl behalten */
  $$('span.ff',blk).forEach(function(x){ if(!x.textContent)x.remove(); });
  const nr=document.createRange(); nr.selectNodeContents(span);
  sel.removeAllRanges(); sel.addRange(nr);
  syncBlock(blk);
  return span;
}
function clearSelectionStyle(){
  const sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  const host=(r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement);
  const blk=host&&host.closest?host.closest('.blk'):null; if(!blk)return;
  const frag=r.extractContents(), box=document.createElement('div');
  box.appendChild(frag);
  $$('span.ff',box).forEach(function(x){ while(x.firstChild)x.parentNode.insertBefore(x.firstChild,x); x.remove(); });
  const neu=document.createDocumentFragment();
  while(box.firstChild)neu.appendChild(box.firstChild);
  r.insertNode(neu);
  syncBlock(blk); ED.focus=blk.dataset.id; ED.caret='end'; renderBlocks();
}

function selSizePop(){

function applyFmt(kind){
  if(kind==='page'){ alsUnterseiteVerlinken(); return; }
  if(kind==='font'){ selFontPop(); return; }
  if(kind==='size'){ selSizePop(); return; }
  const st=$('#seltool');
  const sel=window.getSelection(); if(!sel.rangeCount)return;
  const el=sel.anchorNode&&sel.anchorNode.parentElement?sel.anchorNode.parentElement.closest('.blk'):null;
  try{
    if(kind==='code'){ const t=sel.toString(); if(t) document.execCommand('insertHTML',false,'<code>'+esc(t)+'</code>'); }
    else if(kind==='hl'){ const t=sel.toString(); if(t) document.execCommand('insertHTML',false,'<mark>'+esc(t)+'</mark>'); }
    else if(kind==='link'){ const sv=saveSel(); askText('Link einfügen','https://',function(u){ restoreSel(sv); document.execCommand('createLink',false,u); const b2=window.getSelection().anchorNode; const e2=b2&&(b2.nodeType===1?b2:b2.parentElement); const bl=e2&&e2.closest('.blk'); if(bl)syncBlock(bl); },{eyebrow:'Auswahl',placeholder:'https://…'}); }
    else document.execCommand(kind,false,null);
  }catch(e){}
  if(el)syncBlock(el);
  st.classList.remove('on');
}
function updateSelTool(){
  const st=$('#seltool'), sel=window.getSelection();
  if(TOUCH){ st.classList.remove('on'); dockZustand(); return; }   /* am Touchgerät übernimmt die untere Leiste */
  if(!sel||sel.isCollapsed||!sel.rangeCount){ st.classList.remove('on'); return; }
  const node=sel.anchorNode, host=node&&(node.nodeType===1?node:node.parentElement);
  if(!host||!host.closest('.blk')||!host.closest('#blocks')){ st.classList.remove('on'); return; }
  const r=sel.getRangeAt(0).getBoundingClientRect();
  if(!r.width){ st.classList.remove('on'); return; }
  st.classList.add('on');
  st.style.top=Math.max(8,r.top-st.offsetHeight-8)+'px';
  st.style.left=clamp(r.left+r.width/2-st.offsetWidth/2,8,window.innerWidth-st.offsetWidth-8)+'px';
}

/* =========================================================================
   5b · Leiste über der Tastatur
   Auf Touch-Geräten legt das System sein eigenes Auswahlmenü über die Stelle,
   an der eine schwebende Leiste stünde. Deshalb: unten andocken statt schweben.
   ========================================================================= */
const TOUCH = (function(){
  try{ return window.matchMedia('(pointer:coarse)').matches || (navigator.maxTouchPoints||0)>0; }catch(e){ return false; }
})();
let dockBlockId=null, dockWeg=null;

function dockAn(el){
  if(!TOUCH)return;
  clearTimeout(dockWeg);
  dockBlockId=el?el.dataset.id:dockBlockId;
  const d=$('#dock'); if(!d)return;
  d.hidden=false; document.body.classList.add('dock-on');
  dockZustand(); dockPosition();
}
function dockAus(){
  clearTimeout(dockWeg);
  dockWeg=setTimeout(function(){
    const d=$('#dock'); if(!d)return;
    d.hidden=true; document.body.classList.remove('dock-on'); dockBlockId=null;
  },180);
}
function dockZustand(){
  const sel=window.getSelection();
  const hatAuswahl=!!(sel&&!sel.isCollapsed&&String(sel).length);
  $$('#dockFmt button').forEach(function(b){ b.classList.toggle('dis',!hatAuswahl); });
}
function dockPosition(){
  const vv=window.visualViewport;
  const unten=vv?Math.max(0,Math.round(window.innerHeight-(vv.height+vv.offsetTop))):0;
  document.documentElement.style.setProperty('--kb',unten+'px');
}
function dockBlock(){ return dockBlockId?$('#blocks .blk[data-id="'+dockBlockId+'"]'):null; }
function dockTun(befehl){
  const el=dockBlock()||(document.activeElement&&document.activeElement.closest?document.activeElement.closest('.blk'):null);
  if(!el)return;
  const id=el.dataset.id;
  if(befehl.indexOf('t:')===0){ syncBlock(el); setType(id,befehl.slice(2)); return; }
  if(befehl==='indent'||befehl==='outdent'){
    const b=bById(id); if(!b)return; syncBlock(el);
    b.indent=clamp((b.indent||0)+(befehl==='indent'?1:-1),0,3);
    touch(curPage()); ED.focus=id; ED.caret=caretOffset(el); renderBlocks();
    setTimeout(function(){ const n=$('#blocks .blk[data-id="'+id+'"]'); if(n){n.focus();dockAn(n);} },30);
    return;
  }
  if(befehl==='newblock'){ const nb=insertBlock(id,'p',''); ED.focus=nb.id; ED.caret=0; renderBlocks();
    setTimeout(function(){ const n=$('#blocks .blk[data-id="'+nb.id+'"]'); if(n){n.focus();dockAn(n);} },30); return; }
  if(befehl==='page'){ alsUnterseiteVerlinken(); return; }
  if(befehl==='slash'){
    popItems=BLOCKS.map(function(x){ return{label:x.n,sub:x.d,ico:x.i,run:function(){ setType(id,x.t); }}; });
    showPop($('#dock'),'Block umwandeln'); return;
  }
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!String(sel).length){ toast('Erst Text markieren'); return; }
  applyFmt(befehl);
}

function cellHTML(db,row,pr){
  const v=cellValue(db,row,pr);
  switch(pr.type){
    case 'title': return '<div class="cell title" data-open="'+row.id+'">'+esc(v||'Ohne Titel')+'<span class="open-pg">öffnen</span></div>';

      return '<div class="cell" data-e="'+row.id+'|'+pr.id+'">'+(v?'<span class="tag c-'+optColor(pr,v)+'">'+(pr.type==='status'?'<span class="dot" style="background:currentColor"></span>':'')+esc(v)+'</span>':'')+'</div>';
    case 'multi':
      return '<div class="cell" data-e="'+row.id+'|'+pr.id+'">'+(Array.isArray(v)?v:[]).map(x=>'<span class="tag c-'+optColor(pr,x)+'">'+esc(x)+'</span>').join('')+'</div>';
    case 'checkbox':
      return '<div class="cell"><span class="chk" style="padding:0"><input type="checkbox" data-cb="'+row.id+'|'+pr.id+'"'+(v?' checked':'')+'></span></div>';
    case 'date':
      return '<div class="cell" data-e="'+row.id+'|'+pr.id+'">'+(v?'<span style="font-size:12.5px;color:var(--tx-2)">'+esc(relDate(v))+'</span>':'')+'</div>';
    case 'number':

    case 'url':
      return '<div class="cell" data-e="'+row.id+'|'+pr.id+'">'+(v?'<a href="'+esc(v)+'" target="_blank" rel="noopener" style="color:var(--accent);font-size:12.5px">'+esc(String(v).replace(/^https?:\/\//,'').slice(0,26))+'</a>':'')+'</div>';
    case 'formula':{
      const r=evalFormula(pr.formula||'""',rowCtx(db,row));
      const bad=r&&r.err;
      return '<div class="cell mono" style="font-size:12.5px;color:'+(bad?'var(--rose)':'var(--tx-2)')+'" title="'+esc(pr.formula||'')+'">'+esc(bad?'⚠ '+r.err:(typeof r==='boolean'?(r?'wahr':'falsch'):String(r)))+'</div>';

function renderCalendar(p){
  const db=p.db, v=curView(), rows=viewRows(db,v);
  const dp=propById(db,v.groupBy)||db.props.filter(x=>x.type==='date')[0];
  if(!dp)return '<div class="empty"><div class="e-ico">📅</div><h3>Kalender braucht eine Datumsspalte</h3><p>Lege eine Spalte vom Typ Datum an.</p></div>';
  if(!calCursor){const n=new Date();calCursor={y:n.getFullYear(),m:n.getMonth()};}
  const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const first=new Date(calCursor.y,calCursor.m,1);
  let start=first.getDay(); start=(start+6)%7;                       // Montag zuerst
  const days=new Date(calCursor.y,calCursor.m+1,0).getDate();
  const prevDays=new Date(calCursor.y,calCursor.m,0).getDate();
  const byDay={};
  rows.forEach(function(r){ const d=cellValue(db,r,dp); if(d){ (byDay[d]=byDay[d]||[]).push(r); } });
  let h='<div class="cal-head"><span class="m">'+MN[calCursor.m]+' '+calCursor.y+'</span>'+
    '<button class="btn ghost" data-cal="-1">‹</button><button class="btn ghost" data-cal="0">Heute</button><button class="btn ghost" data-cal="1">›</button></div><div class="cal">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>h+='<div class="dw">'+d+'</div>');
  const today=iso(new Date());
  for(let i=0;i<42;i++){
    let d,mo,yr,out=false;
    if(i<start){ d=prevDays-start+i+1; mo=calCursor.m-1; yr=calCursor.y; out=true; }
    else if(i-start<days){ d=i-start+1; mo=calCursor.m; yr=calCursor.y; }
    else { d=i-start-days+1; mo=calCursor.m+1; yr=calCursor.y; out=true; }
    const dt=new Date(yr,mo,d), key=iso(dt);
    h+='<div class="day'+(out?' out':'')+(key===today?' today':'')+'" data-day="'+key+'"><span class="dn">'+d+'</span>'+
       (byDay[key]||[]).map(r=>'<button class="ev" data-open="'+r.id+'">'+esc(rowTitle(db,r))+'</button>').join('')+'</div>';
  }
  return h+'</div>';
}

/* ---- Zellen bearbeiten --------------------------------------------------- */
function setCell(rowId,propId,val){
  const db=curDB(); const row=db.rows.filter(r=>r.id===rowId)[0]; if(!row)return;
  row.values=row.values||{}; row.values[propId]=val;
  const pr=propById(db,propId);
  /* eingebaute Regel: Status „Fertig“ hakt „Erledigt“ an und setzt Fortschritt */
  if(pr&&pr.type==='status'&&String(val).toLowerCase()==='fertig'){
    const done=db.props.filter(x=>x.type==='checkbox')[0], prog=db.props.filter(x=>x.name==='Fortschritt')[0];
    if(done)row.values[done.id]=true; if(prog)row.values[prog.id]=100;
  }
  touch(curPage()); refreshDB();
}
function editCell(cell){
  const parts=cell.dataset.e.split('|'), rowId=parts[0], propId=parts[1];
  const db=curDB(), pr=propById(db,propId), row=db.rows.filter(r=>r.id===rowId)[0];
  if(!pr||!row)return;
  const val=cellValue(db,row,pr);
  if(pr.type==='select'||pr.type==='status'||pr.type==='multi'){
    popMenu(cell,[{lbl:pr.name}].concat((pr.options||[]).map(function(o){
      const on=pr.type==='multi'?(Array.isArray(val)&&val.indexOf(o.v)>=0):val===o.v;
      return{html:'<span class="tag c-'+o.c+'">'+esc(o.v)+'</span>'+(on?'<span class="sub">✓</span>':''),run:function(){
        if(pr.type==='multi'){ const cur=Array.isArray(val)?val.slice():[]; const i=cur.indexOf(o.v);
          if(i>=0)cur.splice(i,1); else cur.push(o.v); setCell(rowId,propId,cur); }
        else setCell(rowId,propId,val===o.v?'':o.v);
      }};
    })).concat([{sep:true},{html:'<span style="color:var(--tx-3)">Neue Option …</span>',run:function(){
      askText('Neue Option für „'+pr.name+'“','',function(v){
        pr.options=pr.options||[]; pr.options.push({v:v,c:COLORS[pr.options.length%COLORS.length]});
        if(pr.type==='multi'){const cur=Array.isArray(val)?val.slice():[];cur.push(v);setCell(rowId,propId,cur);} else setCell(rowId,propId,v);
      },{eyebrow:'Spalte',placeholder:'z.B. Wartet auf Rückmeldung'});
    }}]));
    return;
  }
  if(pr.type==='date'){
    const pop=$('#pop'); pop.innerHTML='<div class="pop-lbl">'+esc(pr.name)+'</div><input type="date" value="'+esc(val||'')+'"><button class="pop-item" data-clear="1">Leeren</button>';
    placePop(pop,cell); pop.classList.add('on');
    const inp=pop.querySelector('input'); setTimeout(()=>inp.focus(),20);
    inp.onchange=function(){ setCell(rowId,propId,inp.value); closePop(); };
    pop.querySelector('[data-clear]').onclick=function(){ setCell(rowId,propId,''); closePop(); };
    return;
  }
  /* Text, Zahl, Adresse: direkt in der Zelle */
  const w=cell.offsetWidth;
  cell.innerHTML='<input type="'+(pr.type==='number'?'number':'text')+'" value="'+esc(val==null?'':String(val))+'" style="width:100%">';
  const inp=cell.querySelector('input'); inp.focus(); inp.select();
  const commit=function(){ setCell(rowId,propId,pr.type==='number'?(inp.value===''?'':parseFloat(inp.value)):inp.value); };
  inp.onblur=commit;
  inp.onkeydown=function(e){ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){inp.onblur=null;refreshDB();} };
}
function placePop(pop,anchor){
  if(TOUCH){ pop.classList.add('on'); popAlsBlatt(pop); return; }
  pop.classList.remove('sheet');
  const r=anchor.getBoundingClientRect();
  pop.style.top=Math.min(r.bottom+5,window.innerHeight-260)+'px';
  pop.style.left=Math.min(r.left,window.innerWidth-250)+'px';
}
function popMenu(anchor,items){
  const pop=$('#pop');
  pop.innerHTML=items.map(function(it){
    if(it.sep)return '<hr>';
    if(it.lbl)return '<div class="pop-lbl">'+esc(it.lbl)+'</div>';
    return '<button class="pop-item'+(it.danger?' danger':'')+'">'+(it.html||('<span>'+esc(it.label)+'</span>'))+(it.sub?'<span class="sub">'+esc(it.sub)+'</span>':'')+'</button>';
  }).join('');
  const btns=$$('.pop-item',pop); let k=0;
  items.forEach(function(it){ if(it.sep||it.lbl)return; const b=btns[k++]; if(b)b.onclick=function(ev){ev.stopPropagation();closePop();it.run&&it.run();}; });

let mSel=0, mItems=[];

function commands(){

    {i:'＋',t:'Neue Seite',s:'Strg Alt N',run:()=>{const np=newPage({title:'Neue Seite'});openNodes[np.parentId]=true;go('page',np.id);toast('Seite angelegt');}},
    {i:'▦',t:'Neue Datenbank',s:'Tabelle, Board, Kalender',run:()=>{const np=newPage({title:'Neue Datenbank',icon:'▦',type:'db'});go('page',np.id);toast('Datenbank angelegt');}},
    {i:'🔍',t:'Volltextsuche',s:'Strg Shift F',run:()=>openSearch()},
    {i:'◐',t:'Erscheinungsbild wechseln',s:'Strg J',run:()=>toggleTheme()},
    {i:'▤',t:'Konzept & Doku öffnen',s:'',run:()=>go('concept')},
    {i:'▣',t:'Vorlagen',s:'',run:()=>go('templates')},
    {i:'✓',t:'Selbsttest ausführen',s:'',run:()=>go('tests')},
    {i:'⤓',t:'Sicherung herunterladen',s:'JSON',run:()=>doBackup()},
    {i:'🎨',t:'Papierton wechseln',s:'Pastellfarben',run:()=>{go('settings');setTimeout(()=>{const el=document.getElementById('setPaper');if(el)el.scrollIntoView({block:'center'});},80);}},
    {i:'▦',t:'Hintergrundmuster wechseln',s:'liniert, kariert, Punkte',run:()=>{S.settings.pattern=PATTERNS[(PATTERNS.map(x=>x.v).indexOf(S.settings.pattern)+1)%PATTERNS.length].v;applySettings();persist();toast('Muster: '+(PATTERNS.filter(x=>x.v===S.settings.pattern)[0]||{}).n);}},
    {i:'🔒',t:S.settings.vault?'Schutz des Arbeitsbereichs aufheben':'Arbeitsbereich mit Passwort schützen',s:'AES-256',run:()=>{S.settings.vault?removeVault():askVault();}},
    {i:'🗑',t:'Papierkorb',s:'',run:()=>go('trash')},
    {i:'⚙',t:'Einstellungen',s:'',run:()=>go('settings')},
    {i:'📄',t:(p&&p.layout==='doc')?'Darstellung: zurück auf Standard':'Darstellung wie Konzept & Doku',s:'nur für diese Seite',run:()=>{ if(!p)return toast('Erst eine Seite öffnen'); p.layout=(p.layout==='doc')?null:'doc'; touch(p); render(); }},
    {i:'🎨',t:'Papier & Schrift',s:'Ton, Muster, Schriftart',run:()=>{go('settings');setTimeout(function(){const el=document.getElementById('flaeche');if(el)el.scrollIntoView({behavior:'smooth'});},120);}}
  ];

  if(p) c.unshift({i:'⤓',t:'„'+titleOf(p)+'“ als Markdown',s:'',run:()=>{download(titleOf(p).replace(/[^\wÄÖÜäöüß -]/g,'')+'.md',pageToMarkdown(p),'text/markdown');toast('Markdown gespeichert');}});
  if(p&&p.type==='db'&&!(p.locked&&!p.unlocked)) c.unshift({i:'＋',t:'Eintrag in „'+titleOf(p)+'“',s:'',run:()=>newRow()});
  if(p) c.unshift({i:'🔒',t:p.locked?(p.unlocked?'„'+titleOf(p)+'“ wieder verschließen':'„'+titleOf(p)+'“ entsperren'):'„'+titleOf(p)+'“ mit Passwort schützen',s:'',
    run:()=>{ if(!p.locked)askLock(p); else if(p.unlocked){ p.unlocked=false; p.blocks=[]; if(p.db)p.db=null; delete KEYS[p.id]; render(); toast('Wieder verschlossen'); } else askUnlock(p); }});
  return c;

function openPalette(){
  mSel=0;
  openModal('<div class="m-input">'+svg(ICON.search).replace('<svg','<svg style="width:17px;height:17px;color:var(--tx-3)"')+
    '<input id="mq" placeholder="Seite suchen oder Befehl ausführen …" autocomplete="off"></div><div class="m-list" id="mlist"></div>'+
    '<div class="m-foot"><span>↑↓ wählen</span><span>⏎ öffnen</span><span>Esc schließen</span></div>');
  const inp=$('#mq'); inp.focus();
  const draw=function(){
    const q=inp.value.trim();
    const pages=Object.values(S.pages).filter(p=>!p.trashed&&!p.hiddenRow)
      .filter(p=>!q||titleOf(p).toLowerCase().indexOf(q.toLowerCase())>=0)
      .sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,q?6:5)
      .map(p=>({i:p.icon,t:titleOf(p),s:p.template?'Vorlage':(p.type==='db'?'Datenbank':'Seite'),run:()=>go('page',p.id)}));
    const cmds=commands().filter(c=>!q||c.t.toLowerCase().indexOf(q.toLowerCase())>=0);
    mItems=pages.concat(cmds); mSel=0;
    $('#mlist').innerHTML=(pages.length?'<div class="pop-lbl">Seiten</div>':'')+
      pages.map((x,k)=>resHTML(x,k)).join('')+
      (cmds.length?'<div class="pop-lbl">Befehle</div>':'')+
      cmds.map((x,k)=>resHTML(x,k+pages.length)).join('')+
      (mItems.length?'':'<div class="empty" style="padding:28px"><h3>Nichts gefunden</h3><p>Andere Schreibweise probieren.</p></div>');
    markSel();
  };
  inp.oninput=draw; draw();
}
function resHTML(x,k){ return '<button class="res" data-mi="'+k+'"><span class="ico" style="width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-soft);flex:none">'+esc(x.i||'•')+'</span><span style="min-width:0"><span class="rt">'+esc(x.t)+'</span><span class="rs">'+esc(x.s||'')+'</span></span>'+(x.s&&/Strg/.test(x.s)?'<kbd class="rk">'+esc(x.s)+'</kbd>':'')+'</button>'; }
function markSel(){ $$('#mlist .res').forEach((b,i)=>b.classList.toggle('sel',i===mSel)); const s=$('#mlist .res.sel'); if(s)s.scrollIntoView({block:'nearest'}); }
function openSearch(){
  mSel=0;
  openModal('<div class="m-input"><span style="color:var(--tx-3)">🔍</span><input id="mq" placeholder="In allen Seiten und Datenbanken suchen …" autocomplete="off"></div><div class="m-list" id="mlist"></div><div class="m-foot"><span>Titel zählen stärker als Fließtext</span></div>');
  const inp=$('#mq'); inp.focus();
  const draw=function(){
    const q=inp.value.trim(), res=searchAll(q);
    mItems=res.map(r=>({i:r.page.icon,t:titleOf(r.page),s:r.snip,run:()=>go('page',r.page.id)}));
    mSel=0;
    $('#mlist').innerHTML=q?(mItems.map((x,k)=>resHTML(x,k)).join('')||'<div class="empty" style="padding:30px"><div class="e-ico">🔍</div><h3>Kein Treffer für „'+esc(q)+'“</h3><p>Suche berücksichtigt Titel, Blocktext und Datenbankfelder.</p></div>')
      :'<div class="empty" style="padding:30px"><div class="e-ico">⌕</div><h3>Tippe, um zu suchen</h3><p>'+Object.values(S.pages).filter(p=>!p.trashed).length+' Seiten im Index.</p></div>';
    markSel();
  };
  inp.oninput=draw; draw();

/* ---- Eigene Dialoge (prompt/confirm sind in eingebetteten Seiten gesperrt) --- */
let modalMode='list', dlgOk=null;
function dialog(o){
  modalMode='dialog'; dlgOk=null;
  const isText=o.type!=='confirm';
  openModal('<div style="padding:18px 20px 4px"><div class="eyebrow">'+esc(o.eyebrow||'KODEX')+'</div>'+
    '<h3 style="font-family:var(--font-display);font-size:20px;margin:6px 0 4px;font-weight:600">'+esc(o.title)+'</h3>'+
    (o.text?'<p style="font-size:13.5px;color:var(--tx-2);margin:0 0 6px;max-width:52ch">'+esc(o.text)+'</p>':'')+'</div>'+
    (isText?'<div class="m-input" style="padding:8px 20px 14px;border:0"><input id="dq" value="'+esc(o.value==null?'':o.value)+'" placeholder="'+esc(o.placeholder||'')+'" autocomplete="off" style="border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;background:var(--bg)"></div>':'<div style="height:10px"></div>')+
    '<div class="m-foot" style="justify-content:flex-end;gap:8px;padding:12px 16px">'+
    '<button class="btn ghost" id="dlgCancel">'+esc(o.cancelLabel||'Abbrechen')+'</button>'+
    '<button class="btn" id="dlgOk"'+(o.danger?' style="background:var(--rose);color:#fff"':'')+'>'+esc(o.okLabel||'Übernehmen')+'</button></div>');
  const inp=$('#dq');
  if(inp){ setTimeout(function(){ inp.focus(); inp.select(); },30); }
  dlgOk=function(){ const v=inp?inp.value:true; closeModal(); if(o.onOk)o.onOk(v); };
  $('#dlgOk').onclick=function(e){ e.stopPropagation(); dlgOk(); };
  $('#dlgCancel').onclick=function(e){ e.stopPropagation(); closeModal(); };
}
function askText(title,value,onOk,extra){ dialog(Object.assign({title:title,value:value,onOk:function(v){ if(v!=null&&String(v).trim()!=='')onOk(String(v).trim()); }},extra||{})); }
function askYesNo(title,text,onOk,okLabel){ dialog({type:'confirm',title:title,text:text,okLabel:okLabel||'Ja, ausführen',danger:true,onOk:onOk}); }

    const items=[{lbl:'Filter'}];
    v.filters.forEach(function(f,i){
      const pr=propById(db,f.prop);

/* =========================================================================
   9c · Verschlüsselung — AES-256-GCM mit PBKDF2, echtes WebCrypto
   ========================================================================= */
const SEC={ok:!!(window.crypto&&window.crypto.subtle&&window.crypto.getRandomValues), iter:150000};
const KEYS={};          /* Seiten-Schlüssel dieser Sitzung: pageId -> CryptoKey */
let VAULTKEY=null;      /* Schlüssel für den gesamten Arbeitsbereich */
let VAULTSALT=null;

function b64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]); return btoa(s); }
function ub64(str){ const s=atob(str), a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i); return a; }
function randBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function deriveKey(pw,salt){
  const mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:SEC.iter,hash:'SHA-256'},mat,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealWith(key,obj){
  const iv=randBytes(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return{v:1,iv:b64(iv),data:b64(ct)};
}
async function openWith(key,pkg){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(pkg.iv)},key,ub64(pkg.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function pwStrength(pw){
  let s=0; if(pw.length>=8)s++; if(pw.length>=12)s++;
  if(/[A-ZÄÖÜ]/.test(pw)&&/[a-zäöü]/.test(pw))s++; if(/\d/.test(pw))s++; if(/[^\wÄÖÜäöüß]/.test(pw))s++;
  return['sehr schwach','schwach','mittel','gut','stark','sehr stark'][clamp(s,0,5)];
}

/* ---- Einzelne Seite schützen -------------------------------------------- */
async function lockPage(p,pw){
  const salt=randBytes(16), key=await deriveKey(pw,salt);
  const payload={blocks:p.blocks||null,db:p.db||null};
  const pkg=await sealWith(key,payload);
  p.lock={salt:b64(salt),iv:pkg.iv,data:pkg.data};
  p.locked=true; p.unlocked=false;
  p.blocks=[]; if(p.db)p.db=null;
  delete KEYS[p.id];
  touch(p); render(); toast('Seite ist jetzt geschützt');
}
async function unlockPage(p,pw){
  const key=await deriveKey(pw,ub64(p.lock.salt));
  const obj=await openWith(key,{iv:p.lock.iv,data:p.lock.data});   /* wirft bei falschem Passwort */
  p.blocks=obj.blocks||[{id:uid('b'),type:'p',text:'',indent:0}];
  if(obj.db)p.db=obj.db;
  p.unlocked=true; KEYS[p.id]=key;
  render(); toast('Entsperrt — bleibt bis zum Schließen offen');
}
function removePageLock(p){
  if(!p.unlocked){ toast('Erst entsperren'); return; }
  delete p.lock; p.locked=false; p.unlocked=false; delete KEYS[p.id];
  touch(p); render(); toast('Schutz aufgehoben');
}
function askUnlock(p){
  pwDialog({title:'„'+titleOf(p)+'“ entsperren',eyebrow:'Geschützte Seite',okLabel:'Entsperren',
    text:'Der Inhalt liegt verschlüsselt vor und wird erst mit dem richtigen Passwort lesbar.',
    onOk:function(pw){ unlockPage(p,pw).catch(function(){ toast('Falsches Passwort'); setTimeout(function(){askUnlock(p);},400); }); }});
}
function askLock(p){
  if(!SEC.ok){ toast('Verschlüsselung ist in dieser Umgebung nicht verfügbar'); return; }
  pwDialog({title:'„'+titleOf(p)+'“ schützen',eyebrow:'Seite verschlüsseln',repeat:true,okLabel:'Schützen',
    text:'Inhalt und Datenbank dieser Seite werden mit AES-256 verschlüsselt. Ohne Passwort gibt es keinen Weg zurück — es gibt keine Wiederherstellung.',
    onOk:function(pw){ lockPage(p,pw); }});
}
function viewLocked(p){
  return '<div class="pad"><div class="page-head"><span class="page-icon">🔒</span>'+
    '<h1 class="page-title">'+esc(titleOf(p))+'</h1>'+

    '<div class="lockbox"><div class="lb-ico">🔐</div><h3>Diese Seite ist verschlüsselt</h3>'+
    '<p>Der Inhalt liegt als unlesbarer Block im Speicher. Erst dein Passwort macht ihn wieder lesbar.</p>'+
    '<div class="lock-form"><input type="password" id="unlockPw" placeholder="Passwort" autocomplete="current-password" data-unlockfor="'+p.id+'">'+
    '<button class="btn" data-unlock="'+p.id+'">Öffnen</button></div>'+
    '<div class="lock-err" id="unlockErr"></div>'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">'+
    '<button class="btn ghost" data-act="lockinfo">Wie sicher ist das?</button></div>'+
    '<div class="lb-meta mono">'+esc((p.lock&&p.lock.data?Math.round(p.lock.data.length*0.75/102.4)/10:0))+' KB verschlüsselt · PBKDF2 · '+SEC.iter.toLocaleString('de-DE')+' Runden</div></div></div>';
}

}

  if(!SEC.ok){ toast('Verschlüsselung ist in dieser Umgebung nicht verfügbar'); return; }

    text:'Alles wird verschlüsselt gespeichert. Beim nächsten Öffnen erscheint zuerst ein Sperrbildschirm. Vergisst du das Passwort, sind die Daten verloren.',

/* Sperrbildschirm beim Start */
function gate(pkg,onOpen){

  g.innerHTML='<div class="gate-card"><div class="mark" style="width:44px;height:44px;font-size:22px;border-radius:12px;margin:0 auto 16px">K</div>'+

/* Vor dem Speichern: entsperrte Seiten wieder verschließen, alles ggf. in den Tresor legen */
async function buildSnapshot(){
  const hasLocks=Object.values(S.pages).some(p=>p.locked);
  let out=S;
  if(hasLocks){
    out=JSON.parse(JSON.stringify(S));
    for(const id in out.pages){
      const p=out.pages[id];
      if(!p.locked)continue;
      if(p.unlocked&&KEYS[id]){
        const pkg=await sealWith(KEYS[id],{blocks:p.blocks||null,db:p.db||null});
        p.lock={salt:S.pages[id].lock.salt,iv:pkg.iv,data:pkg.data};
      }
      p.blocks=[]; p.db=null; p.unlocked=false;
    }
  }
  if(VAULTKEY&&VAULTSALT){
    const pkg=await sealWith(VAULTKEY,out);
    return{__kodex:'locked',v:1,salt:b64(VAULTSALT),iv:pkg.iv,data:pkg.data};
  }
  return out;
}
async function persistNow(){
  const dot=$('#saveDot'), info=$('#saveInfo');
  if(dot)dot.style.background='var(--brass)'; if(info)info.textContent='sichere …';
  const snap=await buildSnapshot();
  await Store.save(snap);
  if(dot)dot.style.background='var(--teal)';
  if(info)info.textContent='gesichert · '+SAVE_MODE+(VAULTKEY?' · verschlüsselt':'');
}

/* Wieder verschließen: Änderungen neu versiegeln, Schlüssel aus dem Speicher werfen */
async function relockPage(p){
  if(!p||!p.locked||!p.unlocked)return;
  const key=KEYS[p.id];
  if(key){
    const pkg=await sealWith(key,{blocks:p.blocks||null,db:p.db||null});
    p.lock={salt:p.lock.salt,iv:pkg.iv,data:pkg.data};
  }
  p.blocks=[]; p.db=null; p.unlocked=false; delete KEYS[p.id];
  p.updatedAt=Date.now();
  persistNow(); render(); toast('Wieder verschlossen');
}

function wacheStarten(){
  if(wachTimer)return;
  ['keydown','pointerdown','wheel'].forEach(function(ev){
    document.addEventListener(ev,aktionGemerkt,true);
  });
  wachTimer=setInterval(function(){
    const min=(S.settings&&S.settings.autoLock)||0;
    if(!min)return;
    const offen=Object.values(S.pages).filter(function(p){ return p.locked&&p.unlocked; });
    if(!offen.length)return;
    if(Date.now()-letzteAktion<min*60000)return;
    offen.forEach(function(p){ relockPage(p); });

const Transport={
  bc:null, raum:null, ws:null,
  offen:function(){ return !!(this.bc||this.ws); },
  art:function(){ return this.ws?'WebSocket':(this.bc?'Broadcast':'aus'); },
  start:function(raum,wsUrl,onMsg){
    this.stop(); this.raum=raum;
    if(wsUrl){
      try{
        this.ws=new WebSocket(wsUrl);
        this.ws.onmessage=function(e){ try{ onMsg(JSON.parse(e.data)); }catch(x){} };
        this.ws.onopen=function(){ toast('Mit dem Raum verbunden'); syncStatus(); };
        this.ws.onclose=function(){ syncStatus(); };
        this.ws.onerror=function(){ toast('Serververbindung fehlgeschlagen — nutze denselben Browser'); };
      }catch(e){ this.ws=null; }
    }
    if(!this.ws&&window.BroadcastChannel){
      try{
        this.bc=new BroadcastChannel('kodex::'+raum);
        this.bc.onmessage=function(e){ onMsg(e.data); };
      }catch(e){ this.bc=null; }
    }
    /* Zweiter Weg im selben Browser, falls BroadcastChannel fehlt */
    window.addEventListener('storage',function(e){
      if(e.key!=='kodex.bus::'+raum||!e.newValue)return;
      try{ onMsg(JSON.parse(e.newValue)); }catch(x){}
    });
    return this.offen();
  },
  senden:function(obj){
    obj.von=ICH.id; obj.sid=SID; obj.raum=this.raum;
    if(this.ws&&this.ws.readyState===1){ try{ this.ws.send(JSON.stringify(obj)); }catch(e){} }
    if(this.bc){ try{ this.bc.postMessage(obj); }catch(e){} }
    try{ localStorage.setItem('kodex.bus::'+this.raum,JSON.stringify(Object.assign({t:Date.now()},obj))); }catch(e){}
  },
  stop:function(){
    if(this.bc){ try{ this.bc.close(); }catch(e){} this.bc=null; }
    if(this.ws){ try{ this.ws.close(); }catch(e){} this.ws=null; }
  }
};

function syncStart(raum,wsUrl){
  if(!raum)return;
  S.settings.raum=raum; S.settings.wsUrl=wsUrl||'';
  SYNC={raum:raum,seit:Date.now()};
  Transport.start(raum,wsUrl,syncEmpfang);
  syncSenden(true);
  praesenzSenden();
  if(!syncStart._takt)syncStart._takt=setInterval(function(){
    if(!SYNC)return;
    praesenzSenden();
    Object.keys(PEERS).forEach(function(id){ if(Date.now()-PEERS[id].zuletzt>25000)delete PEERS[id]; });
    syncStatus();
  },7000);
  persist(); syncStatus();
  toast('Raum „'+raum+'“ aktiv');
}
function syncStop(){
  if(SYNC)Transport.senden({typ:'tschuess'});
  Transport.stop(); SYNC=null; PEERS={};
  S.settings.raum=''; persist(); syncStatus(); render();
}
function praesenzSenden(){
  if(!SYNC)return;
  const p=(route.view==='page')?curPage():null;

}
/* Geänderte Seiten verschicken — gedrosselt, und nie Klartext aus dem Tresor */
function syncSenden(alles){
  if(!SYNC)return;
  clearTimeout(sendeTimer);
  sendeTimer=setTimeout(function(){
    if(!SYNC)return;
    const pakete=[];
    Object.values(S.pages).forEach(function(p){
      if(p.locked)return;                                  /* geschützte Seiten bleiben lokal */
      const sig=(p.rev||0)+':'+(p.updatedAt||0);
      if(!alles&&letzterSendeStand[p.id]===sig)return;
      letzterSendeStand[p.id]=sig;
      pakete.push(p);
    });
    if(!pakete.length)return;
    const teile={};
    pakete.forEach(function(p){ teile[p.id]=p; });
    Transport.senden({typ:'stand',pages:teile,name:ICH.name});
  },260);
}
function syncEmpfang(msg){
  if(!msg||!SYNC||msg.sid===SID||msg.raum!==SYNC.raum)return;
  if(msg.typ==='da'){
    const neuHier=!PEERS[msg.sid];
    PEERS[msg.sid]={id:msg.von,sid:msg.sid,name:msg.name,farbe:msg.farbe,seite:msg.seite,titel:msg.titel,zuletzt:Date.now()};
    /* Wer schon da war, stellt sich dem Neuankömmling sofort vor */
    if(neuHier){ praesenzSenden(); syncSenden(true); }
    syncStatus();
    if(route.view==='teilen')render();
    return;
  }
  if(msg.typ==='tschuess'){ delete PEERS[msg.sid]; syncStatus(); return; }
  if(msg.typ==='ruf'){ syncSenden(true); return; }
  if(msg.typ!=='stand'||!msg.pages)return;

  const ergebnis=mergeStates(S,{pages:msg.pages,settings:S.settings});
  const aktiverBlock=document.activeElement&&document.activeElement.closest?document.activeElement.closest('.blk'):null;
  const schutzId=aktiverBlock?aktiverBlock.dataset.id:null;
  const schutzText=aktiverBlock?aktiverBlock.innerHTML:null;
  const schutzPos=aktiverBlock?caretOffset(aktiverBlock):null;

  S.pages=ergebnis.state.pages;

  /* Der Block, in dem gerade getippt wird, gehört dem Tippenden */
  if(schutzId){
    const p=curPage();
    if(p&&p.blocks){ const b=p.blocks.filter(function(x){return x.id===schutzId;})[0]; if(b)b.text=schutzText; }
  }
  if(ergebnis.stat.neu||ergebnis.stat.aktualisiert){
    const merker=route.pageId;
    render();
    if(schutzId&&route.pageId===merker){
      const el=$('#blocks .blk[data-id="'+schutzId+'"]');
      if(el)setCaret(el,schutzPos);
    }
    renderTree();
  }
  persist();
}

  leiste.innerHTML=(SYNC?'<span class="peer ich" title="'+esc(ICH.name)+' (du)" style="background:'+ICH.farbe+'">'+esc(initialen(ICH.name))+'</span>':'')+

    }).join('')+

function mergeAusDatei(file){

   10c · App-Paket — ZIP ohne Fremdbibliothek (Ablage ohne Kompression)
   ========================================================================= */
const CRC=(function(){
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return function(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++)c=t[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
})();
function zipBauen(dateien){
  const enc=new TextEncoder(), teile=[], zentral=[];
  let versatz=0;
  const w16=(a,i,v)=>{a[i]=v&255;a[i+1]=(v>>8)&255;};
  const w32=(a,i,v)=>{a[i]=v&255;a[i+1]=(v>>8)&255;a[i+2]=(v>>16)&255;a[i+3]=(v>>24)&255;};
  dateien.forEach(function(d){
    const name=enc.encode(d.name);
    const daten=(d.daten instanceof Uint8Array)?d.daten:enc.encode(d.daten);
    const crc=CRC(daten);
    const kopf=new Uint8Array(30+name.length);
    w32(kopf,0,0x04034b50); w16(kopf,4,20); w16(kopf,6,0); w16(kopf,8,0);
    w16(kopf,10,0); w16(kopf,12,0);
    w32(kopf,14,crc); w32(kopf,18,daten.length); w32(kopf,22,daten.length);
    w16(kopf,26,name.length); w16(kopf,28,0);
    kopf.set(name,30);
    teile.push(kopf,daten);
    const z=new Uint8Array(46+name.length);
    w32(z,0,0x02014b50); w16(z,4,20); w16(z,6,20); w16(z,8,0); w16(z,10,0);
    w16(z,12,0); w16(z,14,0);
    w32(z,16,crc); w32(z,20,daten.length); w32(z,24,daten.length);
    w16(z,28,name.length); w16(z,30,0); w16(z,32,0); w16(z,34,0); w16(z,36,0);
    w32(z,38,0); w32(z,42,versatz);
    z.set(name,46);
    zentral.push(z);
    versatz+=kopf.length+daten.length;
  });
  let zLaenge=0; zentral.forEach(z=>zLaenge+=z.length);
  const ende=new Uint8Array(22);
  w32(ende,0,0x06054b50); w16(ende,4,0); w16(ende,6,0);
  w16(ende,8,dateien.length); w16(ende,10,dateien.length);
  w32(ende,12,zLaenge); w32(ende,16,versatz); w16(ende,20,0);
  return new Blob(teile.concat(zentral,[ende]),{type:'application/zip'});
}
function b64zuBytes(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return a;
}
function symbolBytes(groesse){
  const sel=(groesse===180)?'link[rel="apple-touch-icon"]':null;
  if(sel){ const el=document.querySelector(sel); if(el)return b64zuBytes(el.getAttribute('href').split(',')[1]); }
  try{
    const roh=document.querySelector('link[rel=manifest]').getAttribute('href').split(',')[1];
    const man=JSON.parse(new TextDecoder().decode(b64zuBytes(roh)));
    const treffer=man.icons.filter(function(i){ return i.sizes.indexOf(String(groesse))===0; })[0]||man.icons[0];
    return b64zuBytes(treffer.src.split(',')[1]);
  }catch(e){ return new Uint8Array(0); }
}

      const v=$('#view');

        if(y<r.top+M)v.scrollTop-=S; else if(y>r.bottom-M)v.scrollTop+=S; }
      const under=document.elementFromPoint(clamp(x,1,window.innerWidth-2),clamp(y,1,window.innerHeight-2));

        if(y>r2.top-40&&y<r2.bottom+40){
          if(x<r2.left+M)bd.scrollLeft-=S; else if(x>r2.right-M||x>window.innerWidth-M)bd.scrollLeft+=S; } }
    },40);
  }

    lastPt={x:e.clientX,y:e.clientY};

    if(!DRAG.active){
      if(DRAG.kind==='node'&&!DRAG.armed){ if(dx>8||dy>8){ DRAG=null; clearTimeout(holdT); } return; }

function normalizeOrder(){
  const parents={};
  Object.values(S.pages).forEach(p=>{ const k=p.parentId||'root'; (parents[k]=parents[k]||[]).push(p); });
  Object.keys(parents).forEach(function(k){
    parents[k].sort((a,b)=>(a.order||0)-(b.order||0)).forEach((p,i)=>p.order=i);
  });
}
